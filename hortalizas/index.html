  <!-- CARGA HEADER / FOOTER -->
  <script>
    let currentLang = localStorage.getItem('language') || 'es';

    async function loadHTML(id, file, callback) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
        document.getElementById(id).innerHTML = await res.text();
        if (callback) callback();
      } catch (err) {
        console.error(err);
      }
    }

    // Header 
    loadHTML('header', '/html/header.html', () => {
      const script = document.createElement('script');
      script.src = '/js/menus.js';
      document.body.appendChild(script);
    });

    // Footer
    loadHTML('footer', '/html/footer.html');
  </script>

  <!-- LÓGICA HORTALIZAS -->
  <script>
    // NOTA: Rutas de imágenes estandarizadas a /img/ (ruta absoluta)
    const HORTALIZAS = [
      {
        id: "lechuga",
        imagenPortada: "/img/Lechuga.jpeg",
        imagen: "/img/Lechuga1.jpeg",
        es: {
          nombre: "Lechuga",
          descripcion: "Crujiente, fresca y perfecta para acompañar cualquier comida.",
          variedad: "Frizze"
        },
        en: {
          nombre: "Lettuce",
          descripcion: "Crisp, fresh, and perfect for any meal.",
          variedad: "Frizze"
        }
      },
      {
        id: "cebollin",
        imagenPortada: "/img/galeria/cultivos8.webp",
        imagen: "/img/cebollin.webp",
        es: {
          nombre: "Cebollín",
          descripcion: "Suave, fresco y con ese toque de cebolla."
        },
        en: {
          nombre: "Chives",
          descripcion: "Mild, fresh, and delicately onion-flavored."
        }
      },
      {
        id: "cilantro",
        imagenPortada: "/img/Cilantro.jpg",
        imagen: "/img/Cilantro.jpg",
        es: {
          nombre: "Cilantro",
          descripcion: "Fresco, aromático y lleno de sabor."
        },
        en: {
          nombre: "Cilantro",
          descripcion: "Fresh, aromatic, and full of flavor."
        }
      },
      {
        id: "perejil",
        imagenPortada: "/img/Perejil.jpg",
        imagen: "/img/Perejil.jpg",
        es: {
          nombre: "Perejil",
          descripcion: "Limpio, verde y versátil.",
          variedad: "Liso italiano"
        },
        en: {
          nombre: "Parsley",
          descripcion: "Bright, green, and versatile.",
          variedad: "Flat Italian"
        }
      }
    ];

    const LABELS = {
      es: { variety: "Variedad", close: "Cerrar" },
      en: { variety: "Variety", close: "Close" }
    };

    const tilesContainer = document.getElementById('tiles');
    const resultsContainer = document.getElementById('results');
    // Re-leer idioma por seguridad
    currentLang = localStorage.getItem('language') || 'es';

    function updateStaticText() {
      document.querySelectorAll('[data-es]').forEach(el => {
        const text = el.getAttribute(`data-${currentLang}`);
        if(text) el.textContent = text;
      });
    }

    function renderTiles() {
      tilesContainer.innerHTML = '';
      HORTALIZAS.forEach(p => {
        const d = p[currentLang];
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.id = p.id;
        
        // Rutas de imagen absolutas + Fallback de error
        const errorFallback = `this.onerror=null;this.src='/img/logo2.png'`;

        tile.innerHTML = `
          <img src="${p.imagenPortada}" onerror="${errorFallback}" alt="${d.nombre} - Splendor Herbs" loading="lazy">
          <div class="tile__label"><h3>${d.nombre}</h3></div>
        `;
        tilesContainer.appendChild(tile);
      });
    }

    function openModal(producto) {
      const d = producto[currentLang];
      const lbl = LABELS[currentLang];
      const errorFallback = `this.onerror=null;this.src='/img/logo2.png'`;

      resultsContainer.innerHTML = `
        <article class="card">
          <button class="card__close" aria-label="${lbl.close}">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <img class="card__img" src="${producto.imagen}" onerror="${errorFallback}" alt="${d.nombre}">
          <div class="card__body">
            <h3 class="card__title">${d.nombre}</h3>
            <p class="meta">${d.descripcion}</p>
            ${d.variedad ? `<p class="meta"><b>${lbl.variety}:</b> ${d.variedad}</p>` : ''}
          </div>
        </article>
      `;

      resultsContainer.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      resultsContainer.classList.remove('active');
      document.body.style.overflow = '';
      setTimeout(() => resultsContainer.innerHTML = '', 300);
    }

    tilesContainer.addEventListener('click', e => {
      const tile = e.target.closest('.tile');
      if (!tile) return;
      const p = HORTALIZAS.find(h => h.id === tile.dataset.id);
      if (p) openModal(p);
    });

    resultsContainer.addEventListener('click', e => {
      if (
        e.target === resultsContainer ||
        e.target.closest('.card__close')
      ) {
        closeModal();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === "Escape" && resultsContainer.classList.contains('active')) {
        closeModal();
      }
    });

    document.addEventListener('languageChanged', e => {
      if (e.detail?.language) {
        currentLang = e.detail.language;
        updateStaticText();
        renderTiles();
        closeModal();
      }
    });

    updateStaticText();
    renderTiles();
  </script>
