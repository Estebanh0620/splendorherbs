  <!-- FAVICON -->
  <link rel="shortcut icon" href="/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/icon-192.png">

  <!-- SCHEMA.ORG: ImageGallery -->

  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "ImageGallery",
    "name": "Galería de Operaciones Splendor Herbs",
    "description": "Fotos de cultivos de aromáticas, planta de postcosecha y equipo de trabajo.",
    "url": "https://splendorherbs.com/galeria/",
    "author": {
      "@type": "Organization",

    },
    "image": [
      "https://splendorherbs.com/img/galeria/cultivos1.webp",
      "https://splendorherbs.com/img/galeria/postcosecha1.webp",
      "https://splendorherbs.com/img/galeria/trabajadores1.webp"
    ]
  }
  </script>
</head>

<body>

    <!-- Header -->
    <div id="header"></div>
    
    <main class="main-content">
      
        <!-- Encabezado -->
        <section class="galeria-simple-header">
            <!-- H1 CORREGIDO PARA SEO -->
            <h1 data-es="GALERÍA" data-en="GALLERY">
                GALERÍA
            </h1>

            <div class="separator-leaf">
                <span class="line"></span>
                <i class="fas fa-leaf"></i>
                <span class="line"></span>
            </div>
        </section>

        <!-- GALERÍA -->
        <section class="gallery-section">
            <div class="gallery-wrapper">
                
                <!-- COLUMNA 1 -->
                <div class="gallery-column">
                    <div class="header-container">
                        <h3 class="column-header" data-es="CULTIVOS" data-en="CROPS">
                            CULTIVOS
                        </h3>
                    </div>
                    <div class="column-window">
                        <div class="column-track" id="track1"></div>
                    </div>
                </div>

                <!-- COLUMNA 2 -->
                <div class="gallery-column">
                    <div class="header-container">
                        <h3 class="column-header" data-es="POST COSECHA" data-en="POST-HARVEST">
                            POST COSECHA
                        </h3>
                    </div>
                    <div class="column-window">
                        <div class="column-track" id="track2"></div>
                    </div>
                </div>

                <!-- COLUMNA 3 -->
                <div class="gallery-column">
                    <div class="header-container">
                        <h3 class="column-header" data-es="TRABAJADORES" data-en="OUR TEAM">
                            TRABAJADORES
                        </h3>
                    </div>
                    <div class="column-window">
                        <div class="column-track" id="track3"></div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer"></div>
    
    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal">
        <span class="lightbox-close" onclick="closeLightbox()" aria-label="Cerrar">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="" alt="Vista ampliada">
    </div>

    <!-- ================= SCRIPTS ================= -->
    <script>
        // 1. DATA DE IMÁGENES
        const IMAGENES_GALERIA = {
            columna1: [
                '/img/galeria/cultivos1.webp',
                '/img/galeria/cultivos2.webp',
                '/img/galeria/cultivos3.webp',
                '/img/galeria/cultivos4.webp',
                '/img/galeria/cultivos5.webp',
                '/img/galeria/cultivos6.webp',
                '/img/galeria/cultivos7.webp',
                '/img/galeria/cultivos8.webp'
            ],
            columna2: [
                '/img/galeria/postcosecha1.webp',
                '/img/galeria/postcosecha2.webp',
                '/img/galeria/postcosecha3.webp'
            ],
            columna3: [
                '/img/galeria/trabajadores1.webp',
                '/img/galeria/trabajadores2.webp',
                '/img/galeria/trabajadores3.webp',
                '/img/galeria/trabajadores4.webp'
            ]
        };

        // Etiquetas ALT base para SEO (se les agregará un número)
        const ALT_TEXTS = {
            columna1: "Cultivos de hierbas aromáticas Splendor Herbs",
            columna2: "Procesos de postcosecha y empaque certificado",
            columna3: "Equipo de trabajo Splendor Herbs Colombia"
        };

        const tracks = [
            document.getElementById('track1'),
            document.getElementById('track2'),
            document.getElementById('track3')
        ];

        const SCROLL_SPEED = 0.6;
        let animationFrames = [];
        let isLightboxOpen = false; 

        // 2. INICIALIZACIÓN
        function initGallery() {
            animationFrames.forEach(id => cancelAnimationFrame(id));
            animationFrames = [];

            const isMobile = window.innerWidth <= 900;
            const itemHeightPC = 270;
            const itemWidthMobile = 300;
            const itemSize = isMobile ? itemWidthMobile : itemHeightPC;

            tracks.forEach((track, index) => {
                track.innerHTML = '';
                
                // Delegación de eventos para Lightbox
                track.onclick = function(e) {
                    if (e.target.tagName === 'IMG') {
                        openLightbox(e.target.src);
                    }
                };

                const colKey = `columna${index + 1}`;
                const imagesList = IMAGENES_GALERIA[colKey];
                const altBase = ALT_TEXTS[colKey];
                
                if (!imagesList) return;

                // Crear fragmento base
                const baseFragment = document.createDocumentFragment();
                imagesList.forEach((src, i) => {
                    const img = document.createElement('img');
                    img.src = src;
                    // MEJORA SEO: Agregar Alt Text descriptivo
                    img.alt = `${altBase} - Imagen ${i + 1}`; 
                    // PERFORMANCE: Lazy load y decoding async
                    img.loading = "lazy";
                    img.decoding = "async";
                    
                    img.onerror = () => img.style.display = 'none';
                    img.draggable = false; 
                    baseFragment.appendChild(img);
                });

                // Lógica de clonación infinita
                const windowElement = track.parentElement;
                const windowSize = isMobile ? windowElement.offsetWidth : windowElement.offsetHeight;
                const minContentSize = windowSize * 3;

                let currentSize = 0;
                while (currentSize < minContentSize) {
                    track.appendChild(baseFragment.cloneNode(true));
                    currentSize += imagesList.length * itemSize;
                }
                track.appendChild(baseFragment.cloneNode(true));

                // Lógica de Scroll
                const scrollWindow = track.parentElement;
                let isHovering = false;

                scrollWindow.onmouseenter = () => isHovering = true;
                scrollWindow.onmouseleave = () => isHovering = false;
                scrollWindow.ontouchstart = () => isHovering = true;
                scrollWindow.ontouchend = () => setTimeout(() => isHovering = false, 500);

                let scrollPos = isMobile ? scrollWindow.scrollLeft : scrollWindow.scrollTop;

                function animate() {
                    if (!isHovering && !isLightboxOpen) {
                        scrollPos += SCROLL_SPEED;
                        const limit = isMobile
                            ? scrollWindow.scrollWidth / 2
                            : scrollWindow.scrollHeight / 2;

                        if (scrollPos >= limit) scrollPos = 0;

                        isMobile
                            ? scrollWindow.scrollLeft = scrollPos
                            : scrollWindow.scrollTop = scrollPos;
                    } else {
                        scrollPos = isMobile
                            ? scrollWindow.scrollLeft
                            : scrollWindow.scrollTop;
                    }
                    animationFrames[index] = requestAnimationFrame(animate);
                }
                animate();
            });
        }

        // 3. LIGHTBOX
        function openLightbox(src) {
            const modal = document.getElementById('lightbox');
            const modalImg = document.getElementById('lightbox-img');
            modalImg.src = src;
            modal.classList.add('active');
            isLightboxOpen = true; 
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox');
            modal.classList.remove('active');
            setTimeout(() => {
                document.getElementById('lightbox-img').src = '';
                isLightboxOpen = false; 
            }, 300);
        }

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") closeLightbox();
        });

        window.addEventListener('load', initGallery);

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(initGallery, 200);
        });

        // 4. LÓGICA DE CARGA DE COMPONENTES Y TRADUCCIÓN
        let currentLang = localStorage.getItem('language') || 'es';

        async function loadHTML(id, file, callback) {
            try {
                const res = await fetch(file);
                if (!res.ok) throw new Error("Error loading " + file);
                document.getElementById(id).innerHTML = await res.text();
                if (callback) callback();
            } catch (e) {
                console.error(e);
            }
        }

        // Cargar Header y activar traducción inicial
        loadHTML('header', '/html/header.html', () => {
            const script = document.createElement('script');
            script.src = '/js/menus.js';
            document.body.appendChild(script);
            setLanguage(currentLang); // Traducir header al cargar
        });

        // Cargar Footer
        loadHTML('footer', '/html/footer.html', () => {
            setLanguage(currentLang); // Traducir footer al cargar
        });

        // Función de traducción local (para el contenido de esta página)
        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-es]').forEach(el => {
                el.innerText = el.getAttribute(`data-${lang}`);
            });
        }

        // Ejecutar traducción inicial de la página
        setLanguage(currentLang);

        // Escuchar evento de cambio de idioma (desde menus.js)
        document.addEventListener('languageChanged', e => {
            setLanguage(e.detail.language);
        });

    </script>

</body>
</html>
