<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración base -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO principal -->
  <title>Contacto | Wholesale Herbs & Vegetables Supplier – Splendor Herbs</title>

  <meta name="description" content="Contáctanos para compras mayoristas y exportación de hierbas aromáticas y hortalizas frescas. Splendor Herbs SAS abastece mercados en Colombia, EE.UU. y destinos internacionales.">

  <meta name="keywords" content="contact splendor herbs, wholesale herbs supplier, fresh vegetables exporter colombia, herbs supplier usa, buy herbs wholesale">

  <meta name="author" content="Splendor Herbs SAS">
  <meta name="robots" content="index, follow">
  <meta name="language" content="es, en">

  <!-- SEO geográfico -->
  <meta name="geo.region" content="CO">
  <meta name="geo.placename" content="Colombia">
  <meta name="distribution" content="global">

  <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
  <meta property="og:title" content="Contact | Splendor Herbs Wholesale Supplier">
  <meta property="og:description" content="Get in touch with Splendor Herbs to source fresh herbs and vegetables for wholesale and export markets.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/splendorherbs/img/og-contacto.jpg">
  <meta property="og:url" content="https://splendorherbs.com/contacto">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact – Splendor Herbs">
  <meta name="twitter:description" content="Wholesale contact for fresh herbs and vegetables from Colombia.">
  <meta name="twitter:image" content="/splendorherbs/img/og-contacto.jpg">

  <!-- Performance: Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS principal -->
  <link rel="stylesheet" href="/splendorherbs/css/styles.css">

  <!-- Favicon -->
  <link rel="icon" href="/splendorherbs/img/favicon.png" type="image/png">
</head>

<body>

  <!-- Header -->
  <div id="header"></div>

  <main class="main-content">

    <section class="contacto">
      <h1 class="section-title-contact" data-es="CONTÁCTANOS" data-en="CONTACT US">
        CONTÁCTANOS
      </h1>

      <div class="separator-leaf">
        <span class="line"></span>
        <i class="fas fa-leaf"></i>
        <span class="line"></span>
      </div>

      <!-- Formulario Configurado con FormSubmit -->
      <form class="form-grid" id="contactForm" method="POST" action="https://formsubmit.co/splendorherbssas@gmail.com">

        <!-- CONFIGURACIÓN: Redirección a tu página de gracias en GitHub Pages -->
        <input type="hidden" name="_next" value="https://estebanh0620.github.io/splendorherbs/html/gracias.html">

        <!-- CONFIGURACIÓN: Asunto del correo -->
        <input type="hidden" name="_subject" value="Nuevo mensaje - Splendor Herbs Web">

        <!-- CONFIGURACIÓN: Desactivar Captcha (opcional, ayuda a que sea más rápido) -->
        <input type="hidden" name="_captcha" value="false">

        <!-- CONFIGURACIÓN: Diseño del correo -->
        <input type="hidden" name="_template" value="table">

        <!-- CAMPOS VISIBLES -->
        <div class="field">
          <label for="email" data-es="Correo electrónico" data-en="Email Address">Correo electrónico</label>
          <input id="email" name="email" type="email" required
            placeholder="tucorreo@gmail.com"
            data-ph-es="tucorreo@gmail.com"
            data-ph-en="youremail@gmail.com">
        </div>

        <div class="field">
          <label for="nombres" data-es="Nombre completo" data-en="Full Name">Nombre completo</label>
          <input id="nombres" name="nombres" type="text" required
            placeholder="Ej: Juan Pérez"
            data-ph-es="Ej: Juan Pérez"
            data-ph-en="Ex: John Doe">
        </div>

        <div class="field">
          <label for="celular" data-es="Celular" data-en="Phone Number">Celular</label>
          <input id="celular" name="celular" type="tel">
        </div>

        <div class="field">
          <label for="ciudad" data-es="Ciudad" data-en="City">Ciudad</label>
          <input id="ciudad" name="ciudad" type="text">
        </div>

        <div class="field">
          <label for="direccion" data-es="Dirección" data-en="Address">Dirección</label>
          <input id="direccion" name="direccion" type="text">
        </div>

        <div class="field">
          <label for="pais" data-es="País" data-en="Country">País</label>
          <input id="pais" name="pais" type="text">
        </div>

        <div class="field span-2">
          <label for="observaciones" data-es="Observaciones adicionales" data-en="Additional observations">
            Observaciones adicionales
          </label>
          <textarea id="observaciones" name="observaciones"
            placeholder="Describe aquí lo que necesitas..."
            data-ph-es="Describe aquí lo que necesitas..."
            data-ph-en="Describe here what you need..."></textarea>
        </div>

        <div class="actions span-2">
          <button class="btn" type="submit" data-es="ENVIAR MENSAJE" data-en="SEND MESSAGE">
            ENVIAR MENSAJE
          </button>
        </div>

      </form>
    </section>
  </main>

  <!-- Footer -->
  <div id="footer"></div>

  <script>
    let currentLang = localStorage.getItem('language') || 'es';

    async function loadHTML(id, file, callback) {
      try {
        const res = await fetch(file);
        const text = await res.text();
        document.getElementById(id).innerHTML = text;
        if (callback) callback();
      } catch (err) {
        console.error(err);
      }
    }

    loadHTML('header', '/splendorherbs/html/header.html', () => {
      const script = document.createElement('script');
      script.src = '/splendorherbs/js/menus.js';
      document.body.appendChild(script);
      if (window.checkLanguage) window.checkLanguage();
    });

    loadHTML('footer', '/splendorherbs/html/footer.html');

    function setLanguage(lang) {
      currentLang = lang;

      document.querySelectorAll('[data-es]').forEach(el => {
        el.innerText = el.getAttribute(`data-${lang}`);
      });

      document.querySelectorAll('[data-ph-es]').forEach(el => {
        el.placeholder = el.getAttribute(`data-ph-${lang}`);
      });
    }

    setLanguage(currentLang);

    document.addEventListener('languageChanged', e => {
      setLanguage(e.detail.language);
    });

    const form = document.getElementById('contactForm');
    form.addEventListener('submit', () => {
      // Nota: Como el formulario ahora hace un POST real a FormSubmit,
      // la página se recargará hacia la URL externa y luego volverá a 'gracias.html'.
      // El cambio de texto del botón será visible brevemente antes de la redirección.
      const btn = form.querySelector('.btn');
      btn.innerHTML = currentLang === 'es'
        ? 'ENVIANDO... <i class="fas fa-spinner fa-spin"></i>'
        : 'SENDING... <i class="fas fa-spinner fa-spin"></i>';
      btn.style.opacity = '0.7';
    });
  </script>

</body>
</html>
