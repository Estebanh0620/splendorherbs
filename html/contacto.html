<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Contact</title>

  <!-- Fuentes e iconos -->
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="/splendorherbs/css/styles.css">
</head>
<body>

  <!-- Header -->
  <div id="header"></div>

  <main class="main-content">

    <section class="contacto">
      <h1 class="section-title-contact" data-es="CONTÁCTANOS" data-en="CONTACT US">
        CONTÁCTANOS
      </h1>

      <div class="separator-leaf">
        <span class="line"></span>
        <i class="fas fa-leaf"></i>
        <span class="line"></span>
      </div>

      <!-- Formulario -->
      <form class="form-grid" id="contactForm" method="GET" action="/splendorherbs/html/gracias.html">

        <div class="field">
          <label for="email" data-es="Correo electrónico" data-en="Email Address">Correo electrónico</label>
          <input id="email" name="email" type="email" required
            placeholder="tucorreo@gmail.com"
            data-ph-es="tucorreo@gmail.com"
            data-ph-en="youremail@gmail.com">
        </div>

        <div class="field">
          <label for="nombres" data-es="Nombre completo" data-en="Full Name">Nombre completo</label>
          <input id="nombres" name="nombres" type="text" required
            placeholder="Ej: Juan Pérez"
            data-ph-es="Ej: Juan Pérez"
            data-ph-en="Ex: John Doe">
        </div>

        <div class="field">
          <label for="celular" data-es="Celular" data-en="Phone Number">Celular</label>
          <input id="celular" name="celular" type="tel">
        </div>

        <div class="field">
          <label for="ciudad" data-es="Ciudad" data-en="City">Ciudad</label>
          <input id="ciudad" name="ciudad" type="text">
        </div>

        <div class="field">
          <label for="direccion" data-es="Dirección" data-en="Address">Dirección</label>
          <input id="direccion" name="direccion" type="text">
        </div>

        <div class="field">
          <label for="pais" data-es="País" data-en="Country">País</label>
          <input id="pais" name="pais" type="text">
        </div>

        <div class="field span-2">
          <label for="materiales" data-es="Materiales de interés y cantidad" data-en="Materials of interest and quantity">
            Materiales de interés y cantidad
          </label>
          <textarea id="materiales" name="materiales"
            placeholder="Describe aquí lo que necesitas..."
            data-ph-es="Describe aquí lo que necesitas..."
            data-ph-en="Describe here what you need..."></textarea>
        </div>

        <div class="actions span-2">
          <button class="btn" type="submit" data-es="ENVIAR MENSAJE" data-en="SEND MESSAGE">
            ENVIAR MENSAJE
          </button>
        </div>

      </form>
    </section>
  </main>

  <!-- Footer -->
  <div id="footer"></div>

  <script>
    async function loadHTML(id, file) {
      try {
        const res = await fetch(file);
        if (res.ok) {
           document.getElementById(id).innerHTML = await res.text();

           // AJUSTE DE RUTAS DEL HEADER (Porque header.html tiene rutas pensadas para root)
           // Cuando cargas header.html dentro de una subcarpeta, los links se rompen.
           // Este truco arregla los links del menú:
           if (id === 'header') {
               // 1. Cargar el script de menús (saliendo de la carpeta)
               const script = document.createElement('script');
               script.src = '../js/menus.js'; 
               document.body.appendChild(script);

               // 2. Arreglar imágenes del header (banderas y logo)
               document.querySelectorAll('#header img').forEach(img => {
                   const src = img.getAttribute('src');
                   // Si la ruta empieza con /splendorherbs/, la dejamos o ajustamos
                   // Si empieza con img/, le agregamos ../
                   if (!src.includes('http') && !src.startsWith('/')) {
                       img.src = '../' + src.replace('/splendorherbs/', '');
                   }
               });
           }
        }
      } catch (err) { console.error(err); }
    }

    // Cargar Header (Como estamos en la misma carpeta 'html', solo ponemos el nombre)
    loadHTML('header', 'header.html'); 
    loadHTML('footer', 'footer.html');

    // Lógica del Formulario (Placeholders)
    function setFormLanguage(lang) {
        document.querySelectorAll('[data-es]').forEach(el => {
            el.innerText = el.getAttribute(`data-${lang}`);
        });
        document.querySelectorAll('[data-ph-es]').forEach(el => {
            el.placeholder = el.getAttribute(`data-ph-${lang}`);
        });
    }

    document.addEventListener('languageChanged', (e) => {
        setFormLanguage(e.detail.language);
    });

    // Inicializar
    setTimeout(() => {
         const lang = localStorage.getItem('language') || 'es';
         setFormLanguage(lang);
    }, 200);
</script>

</body>
</html>
