<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Contact</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Header -->
  <div id="header"></div>

  <main class="main-content">
    
    <!-- Sección Contacto -->
    <section class="contacto">
      <h1 class="section-title-contact" data-es="CONTACTANOS" data-en="CONTACT US">
        CONTACTANOS
      </h1>
      <div class="separator-leaf">
         <span class="line"></span>
         <i class="fas fa-leaf"></i>
         <span class="line"></span>
      </div>

      <!-- Formulario -->
      <form class="form-grid" id="contactForm" method="POST" action="...">
        
        <div class="field">
          <label for="email" data-es="Correo electrónico" data-en="Email Address">Correo electrónico</label>
          <!-- Usamos data-ph-es/en para los placeholders -->
          <input id="email" name="email" type="email" required 
                 placeholder="tucorreo@gmail.com"
                 data-ph-es="tucorreo@gmail.com" 
                 data-ph-en="youremail@gmail.com">
        </div>

        <div class="field">
          <label for="nombres" data-es="Nombre completo" data-en="Full Name">Nombre completo</label>
          <input id="nombres" name="nombres" type="text" required 
                 placeholder="Ej: Juan Pérez"
                 data-ph-es="Ej: Juan Pérez" 
                 data-ph-en="Ex: John Doe">
        </div>

        <div class="field">
          <label for="celular" data-es="Celular" data-en="Phone Number">Celular</label>
          <input id="celular" name="celular" type="tel">
        </div>

        <div class="field">
            <label for="ciudad" data-es="Ciudad" data-en="City">Ciudad</label>
            <input id="ciudad" name="ciudad" type="text">
        </div>

        <div class="field">
            <label for="direccion" data-es="Dirección" data-en="Address">Dirección</label>
            <input id="direccion" name="direccion" type="text">
        </div>

        <div class="field">
          <label for="pais" data-es="País" data-en="Country">País</label>
          <input id="pais" name="pais" type="text">
        </div>

        <div class="field span-2">
          <label for="materiales" data-es="Materiales de interés y cantidad" data-en="Materials of interest and quantity">Materiales de interés y cantidad</label>
          <textarea id="materiales" name="materiales" 
                    placeholder="Describe aquí lo que necesitas..."
                    data-ph-es="Describe aquí lo que necesitas..."
                    data-ph-en="Describe here what you need..."></textarea>
        </div>

        <div class="actions span-2">
          <button class="btn" type="submit" data-es="ENVIAR MENSAJE" data-en="SEND MESSAGE">ENVIAR MENSAJE</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script>
    // 1. Variable global de idioma
    let currentLang = localStorage.getItem('language') || 'es';

    async function loadHTML(id, file, callback) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`Error cargando ${file}`);
        const text = await res.text();
        document.getElementById(id).innerHTML = text;
        if (callback) callback();
      } catch (err) {
        console.error("Error cargando componente:", err);
      }
    }

    loadHTML('header', '/html/header.html', () => {
        const script = document.createElement('script');
        script.src = '/js/menus.js';
        document.body.appendChild(script);

        // Intentar sincronizar idioma tras cargar menú
        if(window.checkLanguage) window.checkLanguage();

        setTimeout(() => {
            const toggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('.nav-links');
            if (toggle && nav) {
                toggle.addEventListener('click', () => {
                    nav.classList.toggle('active');
                    toggle.classList.toggle('open');
                });
            }
        }, 500);
    });

    loadHTML('footer', '/html/footer.html');

    // --- LÓGICA DE TRADUCCIÓN DEL FORMULARIO ---

    function setLanguage(lang) {
        currentLang = lang;

        // 1. Actualizar textos normales (Labels, Botones, Títulos)
        const textElements = document.querySelectorAll('[data-es]');
        textElements.forEach(el => {
            el.innerText = el.getAttribute(`data-${lang}`);
        });

        // 2. Actualizar Placeholders (Inputs)
        const phElements = document.querySelectorAll('[data-ph-es]');
        phElements.forEach(el => {
            el.placeholder = el.getAttribute(`data-ph-${lang}`);
        });
    }

    // Inicializar idioma al cargar
    setLanguage(currentLang);

    // Escuchar cambios desde el menú
    document.addEventListener('languageChanged', (e) => {
        if(e.detail && e.detail.language) {
            setLanguage(e.detail.language);
        }
    });

    // --- LÓGICA DE ENVÍO (BILINGÜE) ---
    const form = document.getElementById('contactForm');

    if(form) {
        form.addEventListener('submit', function() {
            const btn = form.querySelector('.btn');
            
            // Texto de "Enviando..." según idioma
            const sendingText = currentLang === 'es' ? 'ENVIANDO...' : 'SENDING...';
            
            btn.innerHTML = `${sendingText} <i class="fas fa-spinner fa-spin"></i>`;
            btn.style.opacity = '0.7';
            // No deshabilitamos inmediatamente si el action no es AJAX, 
            // pero si es un form normal, esto está bien visualmente.
        });
    }
  </script>
</body>
</html>
