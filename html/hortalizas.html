<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración base -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Principal -->
  <title>Hortalizas frescas al por mayor | Fresh Vegetables Wholesale Supplier – Splendor Herbs</title>
  <meta name="description" content="Proveedor mayorista de hortalizas frescas y hierbas aromáticas desde Colombia. Splendor Herbs SAS ofrece vegetales trazables, calidad de exportación y suministro confiable para distribuidores y compradores internacionales.">
  <meta name="keywords" content="hortalizas frescas, fresh vegetables wholesale, wholesale vegetables supplier, proveedor mayorista de hortalizas, export vegetables colombia, herbs and vegetables supplier, fresh produce exporter">
  <meta name="author" content="Splendor Herbs SAS">
  <meta name="robots" content="index, follow">
  <meta name="language" content="es, en">

  <!-- SEO Geográfico -->
  <meta name="geo.region" content="CO">
  <meta name="geo.placename" content="Colombia">
  <meta name="distribution" content="global">

  <!-- Open Graph -->
  <meta property="og:title" content="Hortalizas frescas al por mayor | Fresh Vegetables – Splendor Herbs">
  <meta property="og:description" content="Hortalizas frescas y hierbas aromáticas con estándares de exportación, trazabilidad y suministro constante para el mercado internacional.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/splendorherbs/img/og-hortalizas.jpg">
  <meta property="og:url" content="https://splendorherbs.com/hortalizas">

  <!-- Performance: Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS principal -->
  <link rel="stylesheet" href="/splendorherbs/css/styles.css">

  <!-- Favicon -->
  <link rel="icon" href="/splendorherbs/img/favicon.png" type="image/png">
</head>

<body>
  <!-- Header dinámico -->
  <div id="header"></div>

  <main class="main-content">
    <!-- HERO -->
    <section class="galeria-simple-header">
        <h2 data-es="HORTALIZAS FRESCAS" data-en="FRESH VEGETABLES">HORTALIZAS FRESCAS</h2>
          <!-- SEPARADOR -->
        <div class="separator-leaf">
            <span class="line"></span>
            <i class="fas fa-leaf"></i>
            <span class="line"></span>
        </div>
    </section>

    <!-- Catálogo de tiles -->
    <section class="catalogo">
      <div class="catalogo__intro">
        <h2 data-es="Selecciona una hortaliza para ver su ficha técnica" 
            data-en="Select a vegetable to see its technical sheet">
            Selecciona una hortaliza para ver su ficha técnica
        </h2>
      </div>

      <div class="tiles" id="tiles">
        <!-- Tiles generados por JS -->
      </div>
    </section>
  </main>

  <!-- CORRECCIÓN 1: El Modal (Results) ahora está fuera del Main para tapar toda la pantalla (incluido el header) -->
  <section class="results" id="results">
    <!-- El contenido inicial se carga vía JS -->
  </section>

  <!-- Footer dinámico -->
  <div id="footer"></div>

  <!-- Scripts de Carga de Header/Footer -->
  <script>
  let currentLang = localStorage.getItem('language') || 'es'; 

  async function loadHTML(id, file, callback) {
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
      const text = await res.text();
      document.getElementById(id).innerHTML = text;
      // Ejecutamos el callback inmediatamente después de insertar el HTML
      if (callback) callback();
    } catch (err) {
      console.error(err);
    }
  }

  // CORRECCIÓN 2: Lógica del menú más robusta sin setTimeout
  loadHTML('header', '/splendorherbs/html/header.html', () => {
    
    // 1. Cargar el script de lógica de menús general
    const script = document.createElement('script');
    script.src = '/splendorherbs/js/menus.js';
    document.body.appendChild(script);

    // 2. Configurar el toggle móvil inmediatamente (si no lo hace menus.js)
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.nav-links'); // Asegúrate que esta clase exista en tu header.html
    const menuOverlay = document.querySelector('.menu-overlay'); // Si usas overlay

    if (toggle && nav) {
        toggle.addEventListener('click', () => {
          nav.classList.toggle('active');
          toggle.classList.toggle('active'); // Usamos 'active' para animar las barras
          if(menuOverlay) menuOverlay.classList.toggle('active');
        });
    }

    if(window.checkLanguage) window.checkLanguage();
  });

  loadHTML('footer', '/splendorherbs/html/footer.html');
  </script>

  <!-- Lógica de Hortalizas Bilingüe -->
  <script>
    const HORTALIZAS = [
      {
        id: "lechuga",
        imagen: "/splendorherbs/img/Lechuga.jpeg",
        es: {
          nombre: "Lechuga",
          descripcion: "Crujiente, fresca y perfecta para acompañar cualquier comida. Úsala en ensaladas, wraps, hamburguesas o como base de platos ligeros. Aporta textura y frescura natural. ¡La favorita para comer rico y saludable!",
          variedad: "FRIZZE"
        },
        en: {
          nombre: "Lettuce",
          descripcion: "Crisp, fresh, and perfect for any meal. Ideal for salads, wraps, burgers, or as a base for light dishes. Adds natural freshness and texture. A favorite for eating fresh and healthy.",
          variedad: "FRIZZE"
        }
      },
      {
        id: "cebollin",
        imagen: "/splendorherbs/img/cebollin.png",
        es: {
          nombre: "Cebollin",
          descripcion: "Suave, fresco y con ese toque de cebolla que todos aman. Ideal para huevos, ensaladas, sopas, cremas, arroces y dips. Aporta sabor sin abrumar. ¡Perfecto para darle vida a tus recetas de todos los días!",
        },
        en: {
          nombre: "Chives",
          descripcion: "Mild, fresh, and delicately onion-flavored. Perfect for eggs, salads, soups, creams, rice dishes, and dips. Adds flavor without overpowering. The perfect way to elevate your everyday recipes.",
        }
      },
      {
        id: "cilantro",
        imagen: "/splendorherbs/img/Cilantro.jpg",
        es: {
          nombre: "Cilantro",
          descripcion: "Fresco, aromático y lleno de sabor. El cilantro es el toque indispensable en sopas, guisos, arroces, tacos, salsas y todo tipo de platos caseros. Su aroma auténtico realza cualquier receta. ¡Un clásico infaltable en la cocina colombiana!",
        },
        en: {
          nombre: "Cilantro",
          descripcion: "Fresh, aromatic, and full of flavor. Cilantro is an essential ingredient in soups, stews, rice dishes, tacos, sauces, and homemade meals. Its authentic aroma enhances every recipe. A must-have classic in Latin and international kitchens.",
        }
      },
      {
        id: "perejil",
        imagen: "/splendorherbs/img/Perejil.jpg",
        es: {
          nombre: "Perejil",
          descripcion: "Limpio, verde y versátil. Ideal para sazonar carnes, pastas, ensaladas, adobos y salsas. Aporta un sabor fresco y ligero que complementa todo tipo de preparaciones. ¡Un toque saludable y aromático para tus platos diarios!",
          variedad: "Liso Italiano",
        },
        en: {
          nombre: "Parsley",
          descripcion: "Bright, green, and incredibly versatile. Perfect for seasoning meats, pastas, salads, marinades, and sauces. It adds a fresh, light flavor that complements any dish. A healthy and aromatic touch for everyday cooking.",
          variedad: "flat-leaf parsley"
        }
      }
    ];

    const LABELS = {
      es: { close: "Cerrar" },
      en: { close: "Close" }
    };

    const tilesContainer = document.getElementById('tiles');
    const resultsContainer = document.getElementById('results');
    // Reiniciamos currentLang por si cambió durante la carga
    currentLang = localStorage.getItem('language') || 'es'; 
    let activeProductId = null;

    function updateStaticText() {
      const elements = document.querySelectorAll('[data-es]');
      elements.forEach(el => {
        const text = el.getAttribute(`data-${currentLang}`);
        if (text) el.innerText = text;
      });
    }

    function renderTiles() {
      tilesContainer.innerHTML = '';
      if (HORTALIZAS.length === 0) return;

      HORTALIZAS.forEach(producto => {
        const dataLang = producto[currentLang];
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.id = producto.id;
        
        const errorFallback = `this.onerror=null;this.src='/splendorherbs/img/logo.png'`;

        tile.innerHTML = `
          <img src="${producto.imagen}" onerror="${errorFallback}" alt="${dataLang.nombre}">
          <div class="tile__label">${dataLang.nombre}</div>
        `;
        tilesContainer.appendChild(tile);
      });
    }

    // Modal grande y centrado
    function openModal(producto) {
      const dataLang = producto[currentLang];
      const lbl = LABELS[currentLang];
      const errorFallback = `this.onerror=null;this.src='/splendorherbs/img/logo.png'`;

      resultsContainer.innerHTML = `
        <article class="card">
          <button class="card__close" aria-label="${lbl.close}">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <img class="card__img" src="${producto.imagen}" onerror="${errorFallback}" alt="${dataLang.nombre}">
          <div class="card__body">
            <h3 class="card__title"><span class="badge"></span> ${dataLang.nombre}</h3>
            <p class="meta">${dataLang.descripcion}</p>
          </div>
        </article>
      `;

      resultsContainer.classList.add('active');
      
      // CAMBIO AQUÍ: Usar classList para bloquear scroll
      document.body.classList.add('no-scroll'); 
      
      activeProductId = producto.id;
    }

    function closeModal() {
      resultsContainer.classList.remove('active');
      
      // CAMBIO AQUÍ: Quitar la clase
      document.body.classList.remove('no-scroll'); 
      
      setTimeout(() => {
        resultsContainer.innerHTML = ''; 
        activeProductId = null;
      }, 300);
    }

    function setLanguage(lang) {
      if (lang !== 'es' && lang !== 'en') return;
      currentLang = lang;
      updateStaticText();
      renderTiles();
      
      if (activeProductId && resultsContainer.classList.contains('active')) {
        const ficha = HORTALIZAS.find(f => f.id === activeProductId);
        if (ficha) openModal(ficha);
      }
    }

    tilesContainer.addEventListener('click', (e) => {
      const tile = e.target.closest('.tile');
      if (!tile) return;
      const id = tile.dataset.id;
      const ficha = HORTALIZAS.find(f => f.id === id);
      if (ficha) openModal(ficha);
    });

    resultsContainer.addEventListener('click', (e) => {
      // Cerrar si clic en X o en la parte oscura (fuera del card)
      if (e.target.closest('.card__close') || e.target === resultsContainer) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape" && resultsContainer.classList.contains('active')) {
        closeModal();
      }
    });

    setLanguage(currentLang);
    
    document.addEventListener('languageChanged', (e) => {
       if(e.detail && e.detail.language) setLanguage(e.detail.language);
    });
  </script>
</body>
</html>
