<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hortalizas frescas</title>
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Header dinámico -->
  <div id="header"></div>

  <main class="main-content">
    <!-- HERO -->
    <section class="hero-gal" style="background-image: url('/img/hero-invernadero.jpg');">
        <div class="hero-overlay">
            <div class="hero-col-text-gal">
            <h2>HORTALIZAS</h2>
      </div>
      </div>
    </section>

    <!-- Catálogo de tiles -->
    <section class="catalogo">
      <div class="catalogo__intro">
        <h2>Selecciona una hortaliza para ver su ficha técnica</h2>
        <p>
          Haz clic sobre cualquiera de las hortalizas frescas para ver su ficha con variedad,
          origen, empaque y recomendaciones de almacenamiento.
        </p>
      </div>

      <div class="tiles" id="tiles">
        <!-- Tiles generados por JS -->
      </div>
    </section>

    <!-- Ficha seleccionada -->
    <section class="results" id="results">
      <p class="empty">Haz clic en una hortaliza para ver su ficha.</p>
    </section>
  </main>

  <!-- Footer dinámico -->
  <div id="footer"></div>

  <!-- Scripts de Carga de Header/Footer -->
  <script>
  async function loadHTML(id, file, callback) {
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
      const text = await res.text();
      document.getElementById(id).innerHTML = text;
      if (callback) callback();
    } catch (err) {
      console.error(err);
    }
  }

  loadHTML('header', '/html/header.html', () => {
    const script = document.createElement('script');
    script.src = '/js/menus.js';
    document.body.appendChild(script);

    setTimeout(() => {
      const toggle = document.querySelector('.menu-toggle');
      const nav = document.querySelector('.nav-links');
      if (toggle && nav) {
        toggle.addEventListener('click', () => {
          nav.classList.toggle('active');
          toggle.classList.toggle('open');
        });
      }
    }, 200);
  });

  loadHTML('footer', '/html/footer.html');
  </script>

  <!-- Lógica de Hortalizas (Fija en código) -->
  <script>
    // 1. CONFIGURACIÓN DE PRODUCTOS (Modificar aquí textos e imágenes)
    const HORTALIZAS = [
      {
        nombre: "Lechuga",
        imagen: "/img/Lechuga.jpg", // RUTA DE LAS IMAGENES
        descripcion: "Hortaliza de hojas verdes y crujientes, baja en calorías y base esencial de ensaladas frescas.",
        variedad: "Crespa",
        origen: "Cundinamarca, Colombia",
        empaque: "12 / 18 / 20 unidades por caja",
        temperatura: "32°F - 36°F (0°C – 2°C)"
      },
      {
        nombre: "Cebollin",
        imagen: "/img/Cebollin.jpg",
        descripcion: "De sabor suave a cebolla, se utiliza para sopas, ensaladas y como guarnición en diversos platos.",
        variedad: "Verdeo",
        origen: "Cundinamarca, Colombia",
        empaque: "10 a 12 rollos por caja",
        temperatura: "32°F - 41°F (0°C – 5°C)"
      },
      {
        nombre: "Cilantro",
        imagen: "/img/Cilantro.jpg",
        descripcion: "Hierba de sabor fuerte y fresco, usada en salsas, sopas y cocina tradicional latinoamericana.",
        variedad: "Común",
        origen: "Tolima / Santander, Colombia",
        empaque: "14 a 16 lb por caja",
        temperatura: "32°F - 41°F (0°C – 5°C)"
      },
      {
        nombre: "Perejil",
        imagen: "/img/Perejil.jpg",
        descripcion: "Planta de hojas verdes, muy nutritiva, empleada como condimento, en guarniciones y jugos verdes.",
        variedad: "Liso",
        origen: "Valle del Cauca / Antioquia, Colombia",
        empaque: "14 a 16 lb por caja",
        temperatura: "32°F - 41°F (0°C – 5°C)"
      }
    ];

    const tilesContainer = document.getElementById('tiles');
    const resultsContainer = document.getElementById('results');

    // Función para mostrar mensaje vacío
    function showEmpty(){
      resultsContainer.innerHTML = '<p class="empty">Haz clic en una hortaliza para ver su ficha.</p>';
    }
    
    // Función para crear el cuadrito (Tile)
    function crearTile(ficha) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.nombre = ficha.nombre;
      
      // Fallback simple: si falla .jpg intenta cargar .png (opcional)
      const errorFallback = `this.onerror=null;this.src='/img/${ficha.nombre}.png'`;

      tile.innerHTML = `
        <img src="${ficha.imagen}" onerror="${errorFallback}" alt="${ficha.nombre}">
        <div class="tile__label">${ficha.nombre}</div>
      `;
      return tile;
    }

    // Función para crear la ficha técnica grande
    function createCard(ficha){
      const errorFallback = `this.onerror=null;this.src='/img/${ficha.nombre}.png'`;
      
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <button class="card__close" aria-label="Cerrar ${ficha.nombre}">✕</button>
        <img class="card__img" src="${ficha.imagen}" onerror="${errorFallback}" alt="${ficha.nombre}">
        <div class="card__body">
          <h3 class="card__title"><span class="badge"></span> ${ficha.nombre}</h3>
          <p class="meta">${ficha.descripcion}</p>
          <p class="meta"><b>Variedad:</b> ${ficha.variedad}</p>
          <p class="meta"><b>Origen:</b> ${ficha.origen}</p>
          <p class="meta"><b>Empaque:</b> ${ficha.empaque}</p>
          <p class="meta"><b>Temperatura de almacenamiento:</b> ${ficha.temperatura}</p>
        </div>
      `;
      return card;
    }

    // --- INICIALIZACIÓN ---

    // 1. Renderizar los tiles
    if (HORTALIZAS.length === 0) {
      tilesContainer.innerHTML = '<p class="empty">No hay hortalizas disponibles.</p>';
    } else {
      HORTALIZAS.forEach(producto => {
        tilesContainer.appendChild(crearTile(producto));
      });
    }

    // 2. Evento Clic en Tile -> Mostrar Ficha
    tilesContainer.addEventListener('click', (e) => {
      const tile = e.target.closest('.tile');
      if(!tile) return;

      const nombre = tile.dataset.nombre;
      const ficha = HORTALIZAS.find(f => f.nombre === nombre);
      
      if (ficha) {
        resultsContainer.innerHTML = ''; // Limpiar anterior
        const card = createCard(ficha);
        resultsContainer.appendChild(card);
        // Scroll suave hacia la ficha
        card.scrollIntoView({behavior:'smooth', block:'center'});
      }
    });

    // 3. Evento Cerrar Ficha (Botón X)
    resultsContainer.addEventListener('click', (e) => {
      if(e.target.matches('.card__close')) {
        showEmpty();
      }
    });

    // 4. Evento Cerrar al hacer clic fuera de la tarjeta
    document.addEventListener('click', (e) => {
      const card = resultsContainer.querySelector('.card');
      // Si no hay tarjeta abierta, no hacemos nada
      if(!card) return; 

      const clickedInsideCard = e.composedPath().includes(card);
      const clickedTile = e.target.closest('.tile');

      // Si el clic NO fue dentro de la tarjeta Y NO fue en un tile, cerramos
      if(!clickedInsideCard && !clickedTile) {
        showEmpty();
      }
    });

    // Inicializar estado vacío
    showEmpty();
  </script>
</body>
</html>
