<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración base -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Principal -->
  <title>Hortalizas frescas al por mayor | Fresh Vegetables Wholesale Supplier – Splendor Herbs</title>

  <meta name="description" content="Proveedor mayorista de hortalizas frescas y hierbas aromáticas desde Colombia. Splendor Herbs SAS ofrece vegetales trazables, calidad de exportación y suministro confiable para distribuidores y compradores internacionales.">

  <meta name="keywords" content="hortalizas frescas, fresh vegetables wholesale, wholesale vegetables supplier, proveedor mayorista de hortalizas, export vegetables colombia, herbs and vegetables supplier, fresh produce exporter">

  <meta name="author" content="Splendor Herbs SAS">
  <meta name="robots" content="index, follow">
  <meta name="language" content="es, en">

  <!-- Open Graph -->
  <meta property="og:title" content="Hortalizas frescas al por mayor | Fresh Vegetables – Splendor Herbs">
  <meta property="og:description" content="Hortalizas frescas y hierbas aromáticas con estándares de exportación.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/splendorherbs/img/og-hortalizas.jpg">
  <meta property="og:url" content="https://splendorherbs.com/hortalizas">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/styles.css">

  <link rel="shortcut icon" href="/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
</head>

<body>

  <!-- Header -->
  <div id="header"></div>

  <main class="main-content">

    <!-- HERO -->
    <section class="galeria-simple-header">
      <h2 data-es="HORTALIZAS FRESCAS" data-en="FRESH VEGETABLES">
        HORTALIZAS FRESCAS
      </h2>

      <div class="separator-leaf">
        <span class="line"></span>
        <i class="fas fa-leaf"></i>
        <span class="line"></span>
      </div>
    </section>

    <!-- CATÁLOGO -->
    <section class="catalogo">
      <div class="catalogo__intro">
        <h2 data-es="Selecciona una hortaliza para ver su ficha técnica"
            data-en="Select a vegetable to see its technical sheet">
          Selecciona una hortaliza para ver su ficha técnica
        </h2>
      </div>

      <div class="tiles" id="tiles"></div>
    </section>

  </main>

  <!-- MODAL -->
  <section class="results" id="results"></section>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- CARGA HEADER / FOOTER -->
  <script>
    let currentLang = localStorage.getItem('language') || 'es';

    async function loadHTML(id, file, callback) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
        document.getElementById(id).innerHTML = await res.text();
        if (callback) callback();
      } catch (err) {
        console.error(err);
      }
    }

    // Header (ruta segura desde dominio)
    loadHTML('header', '/html/header.html', () => {
      const script = document.createElement('script');
      script.src = '/js/menus.js';
      document.body.appendChild(script);
    });

    // Footer
    loadHTML('footer', '/html/footer.html');
  </script>

  <!-- LÓGICA HORTALIZAS -->
  <script>
    const HORTALIZAS = [
      {
        id: "lechuga",
        imagenPortada: "../img/Lechuga.jpeg",
        imagen: "../img/Lechuga1.jpeg",
        es: {
          nombre: "Lechuga",
          descripcion: "Crujiente, fresca y perfecta para acompañar cualquier comida.",
          variedad: "Frizze"
        },
        en: {
          nombre: "Lettuce",
          descripcion: "Crisp, fresh, and perfect for any meal.",
          variedad: "Frizze"
        }
      },
      {
        id: "cebollin",
        imagenPortada: "/img/galeria/cultivos8.webp",
        imagen: "/img/cebollin.png",
        es: {
          nombre: "Cebollín",
          descripcion: "Suave, fresco y con ese toque de cebolla."
        },
        en: {
          nombre: "Chives",
          descripcion: "Mild, fresh, and delicately onion-flavored."
        }
      },
      {
        id: "cilantro",
        imagenPortada: "../img/Cilantro.jpg",
        imagen: "../img/Cilantro.jpg",
        es: {
          nombre: "Cilantro",
          descripcion: "Fresco, aromático y lleno de sabor."
        },
        en: {
          nombre: "Cilantro",
          descripcion: "Fresh, aromatic, and full of flavor."
        }
      },
      {
        id: "perejil",
        imagenPortada: "../img/Perejil.jpg",
        imagen: "../img/Perejil.jpg",
        es: {
          nombre: "Perejil",
          descripcion: "Limpio, verde y versátil.",
          variedad: "Liso italiano"
        },
        en: {
          nombre: "Parsley",
          descripcion: "Bright, green, and versatile.",
          variedad: "Flat Italian"
        }
      }
    ];

    const LABELS = {
      es: { variety: "Variedad", close: "Cerrar" },
      en: { variety: "Variety", close: "Close" }
    };

    const tilesContainer = document.getElementById('tiles');
    const resultsContainer = document.getElementById('results');

    function updateStaticText() {
      document.querySelectorAll('[data-es]').forEach(el => {
        el.textContent = el.getAttribute(`data-${currentLang}`);
      });
    }

    function renderTiles() {
      tilesContainer.innerHTML = '';
      HORTALIZAS.forEach(p => {
        const d = p[currentLang];
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.id = p.id;

        tile.innerHTML = `
          <img src="${p.imagenPortada}" alt="${d.nombre}">
          <div class="tile__label">${d.nombre}</div>
        `;
        tilesContainer.appendChild(tile);
      });
    }

    function openModal(producto) {
      const d = producto[currentLang];
      const lbl = LABELS[currentLang];

      resultsContainer.innerHTML = `
        <article class="card">
          <button class="card__close" aria-label="${lbl.close}">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <img class="card__img" src="${producto.imagen}" alt="${d.nombre}">
          <div class="card__body">
            <h3 class="card__title">${d.nombre}</h3>
            <p class="meta">${d.descripcion}</p>
            ${d.variedad ? `<p class="meta"><b>${lbl.variety}:</b> ${d.variedad}</p>` : ''}
          </div>
        </article>
      `;

      resultsContainer.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      resultsContainer.classList.remove('active');
      document.body.style.overflow = '';
      setTimeout(() => resultsContainer.innerHTML = '', 300);
    }

    tilesContainer.addEventListener('click', e => {
      const tile = e.target.closest('.tile');
      if (!tile) return;
      const p = HORTALIZAS.find(h => h.id === tile.dataset.id);
      if (p) openModal(p);
    });

    resultsContainer.addEventListener('click', e => {
      if (
        e.target === resultsContainer ||
        e.target.closest('.card__close')
      ) {
        closeModal();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === "Escape" && resultsContainer.classList.contains('active')) {
        closeModal();
      }
    });

    document.addEventListener('languageChanged', e => {
      if (e.detail?.language) {
        currentLang = e.detail.language;
        updateStaticText();
        renderTiles();
        closeModal();
      }
    });

    updateStaticText();
    renderTiles();
  </script>

</body>
</html>
