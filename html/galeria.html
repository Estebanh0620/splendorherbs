<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galería - Splendor Herbs</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="header"></div>
    
    <main class="main-content">
      
    <section class="galeria-simple-header">
            <h2 data-es="GALERÍA" 
                data-en="GALLERY">
                GALERÍA
            </h2>
             <!-- NUEVO SEPARADOR -->
            <div class="separator-leaf">
                <span class="line"></span>
                <i class="fas fa-leaf"></i>
                <span class="line"></span>
            </div>
        </section>

      <!-- GALERÍA -->
      <section class="gallery-section">
          
          <div class="gallery-wrapper">
              
              <!-- COLUMNA 1: Cultivos -->
              <div class="gallery-column">
                  <div class="header-container">
                    <h3 class="column-header" 
                        data-es="CULTIVOS" 
                        data-en="CROPS">
                        CULTIVOS
                    </h3>
                  </div>
                  <div class="column-window">
                      <div class="column-track" id="track1"></div>
                  </div>
              </div>

              <!-- COLUMNA 2: Post Cosecha -->
              <div class="gallery-column">
                  <div class="header-container">
                    <h3 class="column-header" 
                        data-es="POST COSECHA" 
                        data-en="POST-HARVEST">
                        POST COSECHA
                    </h3>
                  </div>
                  <div class="column-window">
                      <div class="column-track" id="track2"></div>
                  </div>
              </div>

              <!-- COLUMNA 3: Trabajadores -->
              <div class="gallery-column">
                  <div class="header-container">
                    <h3 class="column-header" 
                        data-es="TRABAJADORES" 
                        data-en="OUR TEAM">
                        TRABAJADORES
                    </h3>
                  </div>
                  <div class="column-window">
                      <div class="column-track" id="track3"></div>
                  </div>
              </div>

          </div>
      </section>
    </main>

    <div id="footer"></div>
    
    <!-- LÓGICA DE GALERÍA HÍBRIDA (JS SCROLL) -->
    <script>
        // 1. CONFIGURACIÓN DE IMÁGENES
        const IMAGENES_GALERIA = {
            columna1: ['/img/albahaca.png', 
            '/img/menta.png', 
            '/img/orégano.png', 
            '/img/romero.png'],
            columna2: ['/img/albahaca.png', 
            '/img/menta.png', 
            '/img/orégano.png', 
            '/img/romero.png'],
            columna3: ['/img/albahaca.png', 
            '/img/menta.png', 
            '/img/orégano.png', 
            '/img/romero.png'],
        };

        const tracks = [
            document.getElementById('track1'),
            document.getElementById('track2'),
            document.getElementById('track3')
        ];

        // Velocidad del scroll automático (píxeles por frame aprox)
        const SCROLL_SPEED = 0.6; 
        
        // Variable global para controlar los loops de animación
        let animationFrames = [];

        // Función para renderizar y preparar el bucle infinito
        function initGallery() {
            // Limpiar animaciones previas si existen (al redimensionar)
            animationFrames.forEach(id => cancelAnimationFrame(id));
            animationFrames = [];

            const isMobile = window.innerWidth <= 900;
            const itemHeightPC = 270; // 250px img + 20px margin
            const itemWidthMobile = 300; // 280px img + 20px margin
            const itemSize = isMobile ? itemWidthMobile : itemHeightPC;

            tracks.forEach((track, index) => {
                // Limpiar track
                track.innerHTML = '';
                
                // Obtener lista de imágenes según columna
                const colKey = `columna${index + 1}`;
                const imagesList = IMAGENES_GALERIA[colKey];
                
                if (!imagesList) return;

                // Crear fragmento base
                const baseFragment = document.createDocumentFragment();
                imagesList.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.onerror = function() { this.style.display = 'none'; };
                    baseFragment.appendChild(img);
                });

                // --- DUPLICACIÓN PARA LOOP INFINITO ---
                const windowElement = track.parentElement;
                const windowSize = isMobile ? windowElement.offsetWidth : windowElement.offsetHeight;
                const minContentSize = windowSize * 3; // Mínimo 3 veces el tamaño visible
                
                let currentSize = 0;
                // Agregamos clones hasta llenar el buffer
                while(currentSize < minContentSize) {
                    track.appendChild(baseFragment.cloneNode(true));
                    currentSize += (imagesList.length * itemSize);
                }
                
                // Agregamos un set extra de seguridad al final
                track.appendChild(baseFragment.cloneNode(true));

                // --- LÓGICA DE AUTO-SCROLL CON JS ---
                const scrollWindow = track.parentElement;
                
                // Variables de control de estado
                let isHovering = false;
                
                // Listeners para detectar interacción manual
                scrollWindow.onmouseenter = () => { isHovering = true; };
                scrollWindow.onmouseleave = () => { isHovering = false; };
                scrollWindow.ontouchstart = () => { isHovering = true; };
                scrollWindow.ontouchend = () => { 
                    setTimeout(() => { isHovering = false; }, 500); 
                };

                // Guardamos posición flotante para suavidad
                let scrollPos = isMobile ? scrollWindow.scrollLeft : scrollWindow.scrollTop;

                function animate() {
                    // Si el usuario no está interactuando, avanzamos
                    if (!isHovering) {
                        scrollPos += SCROLL_SPEED;
                        
                        // Detectar límite para el Loop Infinito
                        const limit = isMobile 
                            ? (scrollWindow.scrollWidth / 2) 
                            : (scrollWindow.scrollHeight / 2);

                        if (scrollPos >= limit) {
                            scrollPos = 0; // Teletransporte silencioso al inicio
                        }

                        // Aplicar el movimiento
                        if (isMobile) {
                            scrollWindow.scrollLeft = scrollPos;
                        } else {
                            scrollWindow.scrollTop = scrollPos;
                        }
                    } else {
                        // Si el usuario hace scroll manual, actualizamos nuestra variable
                        scrollPos = isMobile ? scrollWindow.scrollLeft : scrollWindow.scrollTop;
                    }

                    // Solicitar siguiente frame
                    const animId = requestAnimationFrame(animate);
                    animationFrames[index] = animId; 
                }

                // Iniciar animación
                animate();
            });
        }

        // --- INICIALIZACIÓN ---
        
        // 1. Cargar galería
        window.addEventListener('load', initGallery);

        // 2. Recalcular al cambiar tamaño de pantalla (debounce)
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(initGallery, 200);
        });
    </script>

    <!-- Scripts de carga de componentes -->
    <script>
      async function loadHTML(id, file, callback) {
        try {
            const res = await fetch(file);
            if(!res.ok) throw new Error("Error loading " + file);
            const text = await res.text();
            document.getElementById(id).innerHTML = text;
            if (callback) callback();
        } catch(e) { console.error(e); }
      }
      
      loadHTML('header', '/html/header.html', () => {
          const script = document.createElement('script');
          script.src = '/js/menus.js';
          document.body.appendChild(script);
          setTimeout(() => {
            const toggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('.nav-links');
            if (toggle && nav) {
              toggle.addEventListener('click', () => {
                 nav.classList.toggle('active');
                 toggle.classList.toggle('open');
              });
            }
          }, 200);
      });
      
      loadHTML('footer', '/html/footer.html');
    </script>
</body>
</html>
