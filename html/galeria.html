<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galeria Santana</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="header"></div>
    
    <main class="main-content">
      
    <!-- HERO SECTION (Diseño tipo Banner de Referencia) -->
    <section class="hero-gal" style="background-image: url('/img/hero-invernadero.jpg');">
        <div class="hero-overlay">
          
            <div class="hero-col-text-gal">
            <h2>GALERÍA</h2>
       
      </div>
      </div>
       
    </section>

      <!-- GALERÍA -->
      <section class="gallery-section">
          
          <div class="gallery-wrapper">
              
              <!-- COLUMNA 1: Cultivos -->
              <div class="gallery-column">
                  <div class="header-container">
                    <h3 class="column-header">CULTIVOS</h3>
                  </div>
                  <div class="column-window">
                      <div class="column-track" id="track1"></div>
                  </div>
              </div>

              <!-- COLUMNA 2: Post Cosecha -->
              <div class="gallery-column">
                  <div class="header-container">
                    <h3 class="column-header">POST COSECHA</h3>
                  </div>
                  <div class="column-window">
                      <div class="column-track" id="track2"></div>
                  </div>
              </div>

              <!-- COLUMNA 3: Trabajadores -->
              <div class="gallery-column">
                  <div class="header-container">
                    <h3 class="column-header">TRABAJADORES</h3>
                  </div>
                  <div class="column-window">
                      <div class="column-track" id="track3"></div>
                  </div>
              </div>

          </div>
      </section>
    </main>

    <div id="footer"></div>

    <!-- Scripts de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="../js/firebase.js"></script> 
    
    <!-- LÓGICA DE GALERÍA (BUCLE Y RESPONSIVE) -->
    <script>
        const tracks = [
            document.getElementById('track1'),
            document.getElementById('track2'),
            document.getElementById('track3')
        ];

        function setupGalleryAnimation() {
            const isMobile = window.innerWidth <= 900;
            const speedPixelsPerSec = 40; // Velocidad de desplazamiento

            // Tamaños estimados según CSS (Alto + margen) o (Ancho + margen)
            const itemHeightPC = 270; 
            const itemWidthMobile = 300; 
            const itemSize = isMobile ? itemWidthMobile : itemHeightPC;

            tracks.forEach(track => {
                // 1. Obtener imágenes originales limpias
                const originalImages = Array.from(track.querySelectorAll('img:not([aria-hidden="true"])'));
                if (originalImages.length === 0) return;

                track.innerHTML = ''; // Limpiar track
                
                // 2. Calcular tamaño visible de la ventana
                const windowElement = track.closest('.column-window');
                const windowSize = isMobile ? windowElement.offsetWidth : windowElement.offsetHeight;

                // 3. RELLENO INTELIGENTE (While Loop)
                // Repetimos las imágenes originales hasta que superen el tamaño de la ventana
                // Multiplicamos por 2 para asegurar que no queden espacios blancos nunca.
                const baseFragment = document.createDocumentFragment();
                let currentContentSize = 0;
                // Meta de tamaño: Al menos 2 veces la ventana o 1000px, lo que sea mayor
                const targetSize = Math.max(windowSize * 10, 100000); 

                // Creamos el bloque base repetido
                while (currentContentSize < targetSize) {
                    originalImages.forEach(img => {
                        const clone = img.cloneNode(true);
                        baseFragment.appendChild(clone);
                        currentContentSize += itemSize;
                    });
                    if(currentContentSize === 0) break; // Evitar bucle infinito si error
                }

                // 4. Inserción para Animación CSS (0% -> -50%)
                // Insertamos el bloque base (Parte A)
                const partA = baseFragment.cloneNode(true);
                track.appendChild(partA);

                // Insertamos el clon exacto (Parte B) para el efecto infinito
                const partB = baseFragment.cloneNode(true);
                Array.from(partB.childNodes).forEach(node => node.setAttribute('aria-hidden', 'true'));
                track.appendChild(partB);

                // 5. Ajustar velocidad
                // La animación recorre la mitad del track total (currentContentSize)
                const duration = currentContentSize / speedPixelsPerSec;
                const finalDuration = duration < 5 ? 10 : duration;
                
                track.style.setProperty('--speed', `${finalDuration}s`);
            });
        }

        // Carga de Firebase
        if(typeof db !== 'undefined') {
            db.collection('galeria')
              .orderBy('createdAt', 'desc')
              .onSnapshot((snapshot) => {
                tracks.forEach(t => t.innerHTML = '');
                let index = 0;
                snapshot.forEach((doc) => {
                  const data = doc.data();
                  if (!data.url) return;
                  const img = document.createElement('img');
                  img.src = data.url;
                  tracks[index % 3].appendChild(img);
                  index++;
                });
                // Esperar renderizado y ejecutar animación
                setTimeout(setupGalleryAnimation, 500);
              });
        }

        // Recalcular al cambiar tamaño de pantalla
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(setupGalleryAnimation, 500);
        });
    </script>

    <!-- Scripts de carga de componentes -->
    <script>
      async function loadHTML(id, file, callback) {
        const res = await fetch(file);
        const text = await res.text();
        document.getElementById(id).innerHTML = text;
        if (callback) callback();
      }
      loadHTML('header', '/html/header.html', () => {
          const script = document.createElement('script');
          script.src = '/js/menus.js';
          document.body.appendChild(script);
          setTimeout(() => {
            const toggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('.nav-links');
            if (toggle && nav) {
              toggle.addEventListener('click', () => {
                 nav.classList.toggle('active');
                 toggle.classList.toggle('open');
              });
            }
          }, 200);
      });
      loadHTML('footer', '/html/footer.html');
    </script>
</body>
</html>
