<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="/css/styles.css">

  <!-- Favicon -->
  <link rel="icon" href="/splendorherbs/img/favicon.png" type="image/png">
</head>

<body>

    <!-- Header -->
    <div id="header"></div>
    
    <main class="main-content">
      
        <!-- Encabezado -->
        <section class="galeria-simple-header">
            <h2 data-es="GALERÍA" data-en="GALLERY">
                GALERÍA
            </h2>

            <div class="separator-leaf">
                <span class="line"></span>
                <i class="fas fa-leaf"></i>
                <span class="line"></span>
            </div>
        </section>

        <!-- GALERÍA -->
        <section class="gallery-section">
            <div class="gallery-wrapper">
                
                <!-- COLUMNA 1 -->
                <div class="gallery-column">
                    <div class="header-container">
                        <h3 class="column-header" data-es="CULTIVOS" data-en="CROPS">
                            CULTIVOS
                        </h3>
                    </div>
                    <div class="column-window">
                        <div class="column-track" id="track1"></div>
                    </div>
                </div>

                <!-- COLUMNA 2 -->
                <div class="gallery-column">
                    <div class="header-container">
                        <h3 class="column-header" data-es="POST COSECHA" data-en="POST-HARVEST">
                            POST COSECHA
                        </h3>
                    </div>
                    <div class="column-window">
                        <div class="column-track" id="track2"></div>
                    </div>
                </div>

                <!-- COLUMNA 3 -->
                <div class="gallery-column">
                    <div class="header-container">
                        <h3 class="column-header" data-es="TRABAJADORES" data-en="OUR TEAM">
                            TRABAJADORES
                        </h3>
                    </div>
                    <div class="column-window">
                        <div class="column-track" id="track3"></div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer"></div>
    
    <div id="lightbox" class="lightbox-modal">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="">
    </div>
    <!-- ================= GALERÍA JS ACTUALIZADO ================= -->
    <script>
        const IMAGENES_GALERIA = {
            columna1: [
                '/splendorherbs/img/galeria/cultivos1.png',
                '/splendorherbs/img/galeria/cultivos2.png',
                '/splendorherbs/img/galeria/cultivos3.png',
                '/splendorherbs/img/galeria/cultivos4.png',
                '/splendorherbs/img/galeria/cultivos5.png',
                '/splendorherbs/img/galeria/cultivos6.png',
                '/splendorherbs/img/galeria/cultivos7.png',
                '/splendorherbs/img/galeria/cultivos8.png'
            ],
            columna2: [
                '/splendorherbs/img/galeria/postcosecha1.png',
                '/splendorherbs/img/galeria/postcosecha2.png',
                '/splendorherbs/img/galeria/postcosecha3.png'
            ],
            columna3: [
                '/splendorherbs/img/galeria/trabajadores1.png',
                '/splendorherbs/img/galeria/trabajadores2.png',
                '/splendorherbs/img/galeria/trabajadores3.png',
                '/splendorherbs/img/galeria/trabajadores4.png'
            ]
        };

        const tracks = [
            document.getElementById('track1'),
            document.getElementById('track2'),
            document.getElementById('track3')
        ];

        const SCROLL_SPEED = 0.6;
        let animationFrames = [];
        let isLightboxOpen = false; // Bandera para pausar si quieres (opcional)

        function initGallery() {
            animationFrames.forEach(id => cancelAnimationFrame(id));
            animationFrames = [];

            const isMobile = window.innerWidth <= 900;
            const itemHeightPC = 270;
            const itemWidthMobile = 300;
            const itemSize = isMobile ? itemWidthMobile : itemHeightPC;

            tracks.forEach((track, index) => {
                // 1. Limpiar track
                track.innerHTML = '';

                // 2. Crear listener de clicks (Delegación de eventos)
                // Esto asegura que funcione en las copias clonadas
                track.onclick = function(e) {
                    if (e.target.tagName === 'IMG') {
                        openLightbox(e.target.src);
                    }
                };

                const imagesList = IMAGENES_GALERIA[`columna${index + 1}`];
                if (!imagesList) return;

                const baseFragment = document.createDocumentFragment();
                imagesList.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.onerror = () => img.style.display = 'none';
                    // Importante para UX: Evitar que se arrastre la imagen como fantasma
                    img.draggable = false; 
                    baseFragment.appendChild(img);
                });

                const windowElement = track.parentElement;
                const windowSize = isMobile ? windowElement.offsetWidth : windowElement.offsetHeight;
                const minContentSize = windowSize * 3;

                let currentSize = 0;
                while (currentSize < minContentSize) {
                    track.appendChild(baseFragment.cloneNode(true));
                    currentSize += imagesList.length * itemSize;
                }

                track.appendChild(baseFragment.cloneNode(true));

                const scrollWindow = track.parentElement;
                let isHovering = false;

                // Eventos de Mouse/Touch para pausar scroll
                scrollWindow.onmouseenter = () => isHovering = true;
                scrollWindow.onmouseleave = () => isHovering = false;
                scrollWindow.ontouchstart = () => isHovering = true;
                scrollWindow.ontouchend = () => setTimeout(() => isHovering = false, 500);

                let scrollPos = isMobile ? scrollWindow.scrollLeft : scrollWindow.scrollTop;

                function animate() {
                    // Solo animar si no hay hover Y si el lightbox está cerrado
                    // (Si prefieres que siga moviéndose atrás, quita !isLightboxOpen)
                    if (!isHovering && !isLightboxOpen) {
                        scrollPos += SCROLL_SPEED;
                        const limit = isMobile
                            ? scrollWindow.scrollWidth / 2
                            : scrollWindow.scrollHeight / 2;

                        if (scrollPos >= limit) scrollPos = 0;

                        isMobile
                            ? scrollWindow.scrollLeft = scrollPos
                            : scrollWindow.scrollTop = scrollPos;
                    } else {
                        // Sincronizar posición actual por si el usuario hizo scroll manual
                        scrollPos = isMobile
                            ? scrollWindow.scrollLeft
                            : scrollWindow.scrollTop;
                    }

                    animationFrames[index] = requestAnimationFrame(animate);
                }

                animate();
            });
        }

        // --- FUNCIONES LIGHTBOX ---
        function openLightbox(src) {
            const modal = document.getElementById('lightbox');
            const modalImg = document.getElementById('lightbox-img');
            
            modalImg.src = src;
            modal.classList.add('active');
            isLightboxOpen = true; // Pausa la galería
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox');
            modal.classList.remove('active');
            setTimeout(() => {
                document.getElementById('lightbox-img').src = '';
                isLightboxOpen = false; // Reanuda la galería
            }, 300); // Esperar a que termine la transición CSS
        }

        // Cerrar al dar click fuera de la imagen (en el fondo negro)
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Cerrar con tecla ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") closeLightbox();
        });

        window.addEventListener('load', initGallery);

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(initGallery, 200);
        });
    </script>

    <!-- ================= HEADER / FOOTER ================= -->
    <script>
        async function loadHTML(id, file, callback) {
            try {
                const res = await fetch(file);
                if (!res.ok) throw new Error("Error loading " + file);
                document.getElementById(id).innerHTML = await res.text();
                if (callback) callback();
            } catch (e) {
                console.error(e);
            }
        }

            // Header (ruta segura desde dominio)
    loadHTML('header', '/html/header.html', () => {
      const script = document.createElement('script');
      script.src = '/js/menus.js';
      document.body.appendChild(script);
    });

    // Footer
    loadHTML('footer', '/html/footer.html');
    </script>

</body>
</html>
