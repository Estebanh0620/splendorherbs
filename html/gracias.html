<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias | Splendor Herbs</title>

  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">

  <style>
    body {
      background: #f6faf7;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .thankyou-box {
      background: #eaf7ef;
      border: 2px solid #bfe6cf;
      border-radius: 10px;
      padding: 40px;
      max-width: 600px;
    }

    .thankyou-box h1 {
      color: #13854b;
      font-weight: 400;
    }

    .thankyou-box img {
      width: 100px;
      margin-bottom: 20px;
    }

    .btn {
      background: #1a8b59;
      color: #fff;
      padding: 12px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
    }

    .btn:hover {
      background: #167048;
    }
  </style>
</head>
<body>

<div id="header"></div>

<main>
  <div class="thankyou-box">
    <img src="./img/Logo Splendor Herbs.png" alt="Splendor Herbs Logo">
    <h1>¡Gracias por contactarnos!</h1>
    <p>
      Hemos recibido tu mensaje correctamente.<br>
      Nuestro equipo te responderá lo antes posible.
    </p>

    <a href="./html/contacto.html" class="btn">Volver</a>
  </div>
</main>

<div id="footer"></div>

<script>
  async function loadHTML(id, file, callback) {
    const res = await fetch(file);
    const text = await res.text();
    document.getElementById(id).innerHTML = text;
    if (callback) callback();
  }

  loadHTML('header', './html/header.html', () => {
    const script = document.createElement('script');
    script.src = './js/menus.js';
    document.body.appendChild(script);
  });

  loadHTML('footer', './html/footer.html');
</script>

</body>
</html>
