<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias | Splendor Herbs</title>
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      background: #f6faf7;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #1a8b59;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .thankyou-box {
      background: #eaf7ef;
      border: 2px solid #bfe6cf;
      border-radius: 10px;
      padding: 40px 60px;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
      max-width: 600px;
    }

    .thankyou-box h1 {
      font-size: 2.2rem;
      color: #13854b;
      margin-bottom: 10px;
      font-weight: 100;
    }

    .thankyou-box p {
      font-size: 1.1rem;
      color: #1d1d1d;
      margin-bottom: 20px;
    }

    .thankyou-box img {
      width: 100px;
      margin: 20px auto;
      display: block;
    }

    .btn {
      background: #1a8b59;
      color: #fff;
      padding: 12px 28px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s ease;
      text-decoration: none;
      display: inline-block;
      font-weight: 600;
    }

    .btn:hover {
      background: #167048;
    }

    
  </style>
</head>
<body>
  <main>
    <div class="thankyou-box">
      <img src="/img/Logo Splendor Herbs.png" alt="Splendor Herbs Logo">
      <h1>¡Gracias por contactarnos!</h1>
      <p>Hemos recibido tu mensaje correctamente.  
      Nuestro equipo revisará tu solicitud y te responderá lo antes posible.</p>

      <a href="/html/contacto.html" class="btn">Volver</a>
    </div>
  </main>

<div id="footer"></div>

<script>
  // Función para cargar HTML externo
  async function loadHTML(id, file, callback) {
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
      const text = await res.text();
      document.getElementById(id).innerHTML = text;
      if (callback) callback();
    } catch (err) {
      console.error(err);
    }
  }

  // Cargar el header y luego inicializar el menú
  loadHTML('header', '/html/header.html', () => {
    const script = document.createElement('script');
    script.src = '/js/menus.js';
    document.body.appendChild(script);

    setTimeout(() => {
      const toggle = document.querySelector('.menu-toggle');
      const nav = document.querySelector('.nav-links');
      if (toggle && nav) {
        toggle.addEventListener('click', () => {
          nav.classList.toggle('active');
          toggle.classList.toggle('open');
        });
      }
    }, 200);
  });

  // Cargar el footer
  loadHTML('footer', '/html/footer.html');
</script>
</body>
</html>
