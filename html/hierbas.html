<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hierbas aromáticas | Aromatic Herbs</title>

  <!-- Fuentes e iconos -->
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- CSS (ruta corregida) -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- Header dinámico -->
  <div id="header"></div>

  <main class="main-content">

    <!-- HERO -->
    <section class="galeria-simple-header">
      <h2 data-es="HIERBAS AROMÁTICAS" data-en="AROMATIC HERBS">
        HIERBAS AROMÁTICAS
      </h2>

      <div class="separator-leaf">
        <span class="line"></span>
        <i class="fas fa-leaf"></i>
        <span class="line"></span>
      </div>
    </section>

    <!-- Catálogo -->
    <section class="catalogo">
      <div class="catalogo__intro">
        <h2 data-es="Selecciona una hierba para ver su ficha técnica"
            data-en="Select an herb to see its technical sheet">
          Selecciona una hierba para ver su ficha técnica
        </h2>
      </div>

      <div class="tiles" id="tiles"></div>
    </section>

    <!-- Ficha -->
    <section class="results" id="results"></section>

  </main>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- ================= HEADER / FOOTER ================= -->
  <script>
    let currentLang = localStorage.getItem('language') || 'es';

    async function loadHTML(id, file, callback) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
        document.getElementById(id).innerHTML = await res.text();
        if (callback) callback();
      } catch (err) {
        console.error(err);
      }
    }

    loadHTML('header', './html/header.html', () => {
      const script = document.createElement('script');
      script.src = './js/menus.js';
      document.body.appendChild(script);

      if (window.checkLanguage) window.checkLanguage();
    });

    loadHTML('footer', './html/footer.html');
  </script>

  <!-- ================= LÓGICA DE HIERBAS ================= -->
  <script>
    const HIERBAS = [
      {
        id: "menta",
        imagen: "./img/Menta.jpg",
        es: {
          nombre: "Menta",
          descripcion: "Refrescante, aromática y vibrante. La menta es el toque perfecto para tus jugos, postres, aguas frescas y cocteles. Ideal para calmar el estómago y aportar frescura natural a tus recetas diarias. ¡Un imprescindible en toda cocina!",
          variedad: "Común"
        },
        en: {
          nombre: "Mint",
          descripcion: "Refreshing, aromatic, and vibrant. Mint is perfect for juices, desserts, fresh waters, and cocktails. Known for its soothing properties and natural freshness. An essential herb for every kitchen.",
          variedad: "Common"
        }
      },
      {
        id: "romero",
        imagen: "./img/Romero.jpg",
        es: {
          nombre: "Romero",
          descripcion: "Potente, aromático y lleno de sabor. El romero realza carnes, papas, panes, salsas y asados. Su fragancia mediterránea transforma cualquier plato.",
          variedad: "Común"
        },
        en: {
          nombre: "Rosemary",
          descripcion: "Bold, aromatic, and full of character. Rosemary enhances meats, potatoes, breads, sauces, and roasted dishes.",
          variedad: "Common"
        }
      },
      {
        id: "oregano",
        imagen: "./img/Orégano.jpg",
        es: {
          nombre: "Orégano",
          descripcion: "Tu aliado perfecto en pastas, pizzas, sopas y adobos. Su aroma intenso y sabor cálido elevan cualquier receta casera.",
          variedad: "Mediterráneo"
        },
        en: {
          nombre: "Oregano",
          descripcion: "The perfect companion for pastas, pizzas, soups, and marinades.",
          variedad: "Mediterranean"
        }
      },
      {
        id: "albahaca",
        imagen: "./img/Albahaca.jpg",
        es: {
          nombre: "Albahaca",
          descripcion: "Dulce y fragante. Imprescindible para pastas, pesto, pizzas, ensaladas y bebidas.",
          variedad: "Genovesa"
        },
        en: {
          nombre: "Basil",
          descripcion: "Sweet and fragrant. Essential for pastas, pesto, pizzas, salads, and drinks.",
          variedad: "Genovese"
        }
      }
    ];

    const LABELS = {
      es: {
        variety: "Variedad",
        empty: "Haz clic en una hierba para ver su ficha técnica.",
        close: "Cerrar"
      },
      en: {
        variety: "Variety",
        empty: "Click on an herb to see its details.",
        close: "Close"
      }
    };

    const tilesContainer = document.getElementById('tiles');
    const resultsContainer = document.getElementById('results');
    let activeProductId = null;

    function updateStaticText() {
      document.querySelectorAll('[data-es]').forEach(el => {
        el.innerText = el.getAttribute(`data-${currentLang}`);
      });
    }

    function showEmpty() {
      activeProductId = null;
      resultsContainer.innerHTML = `<p class="empty">${LABELS[currentLang].empty}</p>`;
    }

    function createCard(producto) {
      const d = producto[currentLang];
      return `
        <article class="card">
          <button class="card__close">✕</button>
          <img class="card__img" src="${producto.imagen}" alt="${d.nombre}">
          <div class="card__body">
            <h3 class="card__title">${d.nombre}</h3>
            <p class="meta">${d.descripcion}</p>
            <p class="meta"><b>${LABELS[currentLang].variety}:</b> ${d.variedad}</p>
          </div>
        </article>
      `;
    }

    function renderTiles() {
      tilesContainer.innerHTML = '';
      HIERBAS.forEach(p => {
        tilesContainer.innerHTML += `
          <div class="tile" data-id="${p.id}">
            <img src="${p.imagen}" alt="${p[currentLang].nombre}">
            <div class="tile__label">${p[currentLang].nombre}</div>
          </div>
        `;
      });
    }

    function setLanguage(lang) {
      currentLang = lang;
      updateStaticText();
      renderTiles();

      if (activeProductId) {
        const p = HIERBAS.find(h => h.id === activeProductId);
        resultsContainer.innerHTML = createCard(p);
      } else {
        showEmpty();
      }
    }

    tilesContainer.addEventListener('click', e => {
      const tile = e.target.closest('.tile');
      if (!tile) return;

      const p = HIERBAS.find(h => h.id === tile.dataset.id);
      activeProductId = p.id;
      resultsContainer.innerHTML = createCard(p);
      resultsContainer.scrollIntoView({ behavior: 'smooth' });
    });

    resultsContainer.addEventListener('click', e => {
      if (e.target.classList.contains('card__close')) showEmpty();
    });

    document.addEventListener('languageChanged', e => {
      if (e.detail?.language) setLanguage(e.detail.language);
    });

    setLanguage(currentLang);
  </script>

</body>
</html>
