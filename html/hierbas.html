<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hierbas aromáticas | Aromatic Herbs</title>
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Header dinámico -->
  <div id="header"></div>

  <main class="main-content">
    <!-- HERO -->
    <section class="galeria-simple-header">
        <h2 data-es="HIERBAS AROMÁTICAS" data-en="AROMATIC HERBS">HIERBAS AROMÁTICAS</h2>
        <!-- SEPARADOR -->
        <div class="separator-leaf">
            <span class="line"></span>
            <i class="fas fa-leaf"></i>
            <span class="line"></span>
        </div>
    </section>

    <!-- Catálogo de tiles -->
    <section class="catalogo">
      <div class="catalogo__intro">
        <h2 data-es="Selecciona una hierba para ver su ficha técnica" 
            data-en="Select an herb to see its technical sheet">
            Selecciona una hierba para ver su ficha técnica
        </h2>
      </div>

      <div class="tiles" id="tiles">
        <!-- Tiles generados por JS -->
      </div>
    </section>

    <!-- Ficha seleccionada -->
    <section class="results" id="results">
      <!-- Contenido dinámico -->
    </section>
  </main>

  <!-- Footer dinámico -->
  <div id="footer"></div>

  <!-- Cargar header/footer y menú -->
  <script>
  // 1. Recuperar idioma correcto (language)
  let currentLang = localStorage.getItem('language') || 'es';

  async function loadHTML(id, file, callback) {
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
      const text = await res.text();
      document.getElementById(id).innerHTML = text;
      if (callback) callback();
    } catch (err) {
      console.error(err);
    }
  }

  loadHTML('header', '/html/header.html', () => {
    const script = document.createElement('script');
    script.src = '/js/menus.js';
    document.body.appendChild(script);

    setTimeout(() => {
      // Intentar sincronizar idioma tras cargar menú
      // (Por si el menú tiene su propia lógica inicial)
      if(window.checkLanguage) window.checkLanguage();
      
      const toggle = document.querySelector('.menu-toggle');
      const nav = document.querySelector('.nav-links');
      if (toggle && nav) {
        toggle.addEventListener('click', () => {
          nav.classList.toggle('active');
          toggle.classList.toggle('open');
        });
      }
    }, 200);
  });

  loadHTML('footer', '/html/footer.html');
  </script>

  <!-- Lógica de Hierbas Bilingüe -->
  <script>
    // 2. CONFIGURACIÓN DE DATOS BILINGÜES
    const HIERBAS = [

        id: "menta",

          variedad: "Común"
        },
        en: {
          nombre: "Mint",
          descripcion: "Refreshing, aromatic, and vibrant. Mint is perfect for juices, desserts, fresh waters, and cocktails. Known for its soothing properties and natural freshness. An essential herb for every kitchen.",
          variedad: "Common"
        }
      },
      {
        id: "romero",
        imagen: "/img/Romero.jpg",
        es: {
          nombre: "Romero",
          descripcion: "Potente, aromático y lleno de sabor. El romero realza carnes, papas, panes, salsas y asados. Su fragancia mediterránea transforma cualquier plato. ¡El secreto para cocinar con aroma gourmet todos los días!",
          variedad: "Común"
        },
        en: {
          nombre: "Rosemary",
          descripcion: "Bold, aromatic, and full of character. Rosemary enhances meats, potatoes, breads, sauces, and roasted dishes. Its Mediterranean fragrance transforms any recipe. The secret to gourmet flavor at home.",
          variedad: "Common"
        }
      },
      {
        id: "oregano",
        imagen: "/img/Orégano.jpg",
        es: {
          nombre: "Orégano",
          descripcion: "Tu aliado perfecto en pastas, pizzas, sopas y adobos. Su aroma intenso y sabor cálido elevan cualquier receta casera. ¡Un clásico que nunca puede faltar!",
          variedad: "Mediterráneo"
        },
        en: {
          nombre: "Oregano",
          descripcion: "The perfect companion for pastas, pizzas, soups, and marinades. Its warm aroma and robust flavor elevate homemade meals. A timeless classic you can’t cook without.",
          variedad: "Mediterranean"
        }
      },
      {
        id: "mejorana",
        imagen: "/img/Mejorana.jpg",
        es: {
          nombre: "Mejorana",
          descripcion: "Dulce, suave y con notas florales. Perfecta para guisos, vegetales, salsas y carnes blancas. Aporta un toque delicado que conquista paladares. ¡Ideal para recetas caseras que se sienten “hechas con amor”!",
          variedad: "Dulce"
        },
        en: {
          nombre: "Marjoram",
          descripcion: "Mild, sweet, and delicately floral. Ideal for stews, vegetables, sauces, and white meats. Adds a gentle flavor that delights the palate. Perfect for recipes made with love.",

        }
      },
      {
        id: "estragon",

        es: {

          descripcion: "Elegante y aromático. El estragón aporta un sabor único a ensaladas, salsas cremosas y pescados. Su toque anisado lo hace perfecto para cocina fina y platos especiales. ¡Un sabor exclusivo para tu mesa!",
          variedad: "Francés"
        },
        en: {

        }
      },
      {
        id: "laurel",
        imagen: "/img/Laurel.jpg",
        es: {

          descripcion: "Hojas que perfuman todo. Perfectas para sopas, arroces, fríjoles, carnes y guisos. El laurel libera aroma lentamente y transforma tus recetas en platillos llenos de sabor profundo. ¡Tu cocina, pero mejor!",
          variedad: "Común"
        },
        en: {

        }
      },
      {
        id: "eneldo",
        imagen: "/img/Eneldo.jpg",
        es: {

          descripcion: "Fresco y cítrico. Ideal para pescados, ensaladas, salsas, dips y encurtidos. Su sabor ligero ilumina cualquier plato. ¡Perfecto para recetas frescas y modernas!",
          variedad: "Fino"
        },
        en: {
          nombre: "Dill",
          descripcion: "Fresh and lightly citrusy. Ideal for fish, salads, sauces, dips, and pickles. Its delicate flavor brightens any dish. Perfect for fresh and modern recipes.",
          variedad: "Fine"
        }
      },
      {
        id: "tomillo",
        imagen: "/img/Tomillo.jpg",
        es: {
          nombre: "Tomillo",
          descripcion: "Aromático, versátil y robusto. Recomendado para carnes, pollo, vegetales, panes y marinadas. Un toque de tomillo convierte recetas simples en platos llenos de personalidad. ¡Sabor casero con estilo!",
          variedad: "Común"
        },
        en: {
          nombre: "Thyme",
          descripcion: "Aromatic, versatile, and robust. Perfect for meats, chicken, vegetables, breads, and marinades. A touch of thyme turns simple dishes into flavorful creations. Homestyle flavor with character.",
          variedad: "Common"
        }
      },
      {
        id: "albahaca",
        imagen: "/img/Albahaca.jpg",
        es: {
          nombre: "Albahaca",
          descripcion: "Dulce y fragante. Imprescindible para pastas, pesto, pizzas, ensaladas y bebidas. Su aroma fresco despierta todos los sentidos. ¡Sabe a cocina fresca y natural!",
          variedad: "Genovesa"
        },
        en: {
          nombre: "Basil",
          descripcion: "Sweet and fragrant. Essential for pastas, pesto, pizzas, salads, and drinks. Its fresh aroma awakens the senses. The taste of fresh, natural cooking.",
          variedad: "Genovese"
        }
      },
      {
        id: "hierbabuena",
        imagen: "/img/Hierbabuena.jpg",
        es: {
          nombre: "Hierbabuena",
          descripcion: "Refrescante, aromática y deliciosa. Perfecta para limonadas, cocteles, infusiones y postres. También realza sopas y platos tradicionales. ¡Un toque verde que enamora!",
          variedad: "Común"
        },
        en: {
          nombre: "Spearmint",
          descripcion: "Refreshing, aromatic, and delicious. Perfect for lemonades, cocktails, infusions, and desserts. Also enhances traditional savory dishes. A fresh green touch you’ll fall in love with.",
          variedad: "Common"
        }
      }
    ];

    // Etiquetas estáticas para la ficha
    const LABELS = {
      es: {
        variety: "Variedad",
        origin: "Origen",
        empty: "Haz clic en una hierba para ver su ficha técnica.",
        close: "Cerrar"
      },
      en: {
        variety: "Variety",
        origin: "Origin",
        empty: "Click on an herb to see its details.",
        close: "Close"
      }
    };

    const tilesContainer = document.getElementById('tiles');
    const resultsContainer = document.getElementById('results');
    
    // Control de ficha activa
    let activeProductId = null;

    // Actualizar Textos Estáticos (H2, P del HTML principal)
    function updateStaticText() {
      const elements = document.querySelectorAll('[data-es]');
      elements.forEach(el => {
        const text = el.getAttribute(`data-${currentLang}`);
        if (text) el.innerText = text;
      });
    }

    // Mostrar mensaje de vacío
    function showEmpty(){
      activeProductId = null;
      resultsContainer.innerHTML = `<p class="empty">${LABELS[currentLang].empty}</p>`;
    }
    
    // Crear Ficha Grande
    function createCard(producto){
      const dataLang = producto[currentLang];
      const lbl = LABELS[currentLang];
      const errorFallback = `this.onerror=null;this.src='/img/${producto.es.nombre}.png'`;
      
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <button class="card__close" aria-label="${lbl.close}">✕</button>
        <img class="card__img" src="${producto.imagen}" onerror="${errorFallback}" alt="${dataLang.nombre}">
        <div class="card__body">
          <h3 class="card__title"><span class="badge"></span> ${dataLang.nombre}</h3>
          <p class="meta">${dataLang.descripcion}</p>
          <p class="meta"><b>${lbl.variety}:</b> ${dataLang.variedad}</p>
        </div>
      `;
      return card;
    }

    // Renderizar Tiles (Miniaturas)
    function renderTiles() {
      tilesContainer.innerHTML = '';
      if (HIERBAS.length === 0) {
        tilesContainer.innerHTML = '<p class="empty">No data.</p>';
        return;
      }

      HIERBAS.forEach(producto => {
        const dataLang = producto[currentLang];
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.id = producto.id; // Usamos ID para identificar
        
        const errorFallback = `this.onerror=null;this.src='/img/${producto.es.nombre}.png'`;

        tile.innerHTML = `
          <img src="${producto.imagen}" onerror="${errorFallback}" alt="${dataLang.nombre}">
          <div class="tile__label">${dataLang.nombre}</div>
        `;
        tilesContainer.appendChild(tile);
      });
    }

    // Función principal de Cambio de Idioma
    function setLanguage(lang) {
      if (lang !== 'es' && lang !== 'en') return;
      currentLang = lang;
      
      // 1. HTML Estático
      updateStaticText();
      
      // 2. Tiles (nombres debajo de foto)
      renderTiles();

      // 3. Ficha activa (si hay una abierta)
      if (activeProductId) {
        const ficha = HIERBAS.find(f => f.id === activeProductId);
        if (ficha) {
          resultsContainer.innerHTML = '';
          resultsContainer.appendChild(createCard(ficha));
        }
      } else {
        showEmpty();
      }
    }

    // --- EVENTOS INTERNOS ---

    // Clic en Tile
    tilesContainer.addEventListener('click', (e) => {
      const tile = e.target.closest('.tile');
      if(!tile) return;

      const id = tile.dataset.id;
      const ficha = HIERBAS.find(f => f.id === id);
      
      if (ficha) {
        activeProductId = id;
        resultsContainer.innerHTML = ''; 
        const card = createCard(ficha);
        resultsContainer.appendChild(card);
        card.scrollIntoView({behavior:'smooth', block:'center'});
      }
    });

    // Cerrar Ficha
    resultsContainer.addEventListener('click', (e) => {
      if(e.target.matches('.card__close')) showEmpty();
    });

    // Clic fuera cierra
    document.addEventListener('click', (e) => {
      const card = resultsContainer.querySelector('.card');
      if(!card) return; 
      const clickedInsideCard = e.composedPath().includes(card);
      const clickedTile = e.target.closest('.tile');
      if(!clickedInsideCard && !clickedTile) showEmpty();
    });

    // --- INICIALIZACIÓN Y CONEXIÓN CON MENÚ ---
    
    // 1. Cargar estado inicial
    setLanguage(currentLang);

    // 2. Escuchar evento desde menus.js
    document.addEventListener('languageChanged', (e) => {
       if(e.detail && e.detail.language) {
         setLanguage(e.detail.language);
       }
    });

  </script>
</body>
</html>
