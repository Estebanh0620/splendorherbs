<html lang="es">
<head>

  <meta name="author" content="Splendor Herbs SAS">
  <meta name="language" content="es, en">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:title" content="Hierbas aromáticas frescas | Splendor Herbs">

  <meta property="og:type" content="website">
  <meta property="og:image" content="/splendorherbs/img/og-hierbas.jpg">

  <!-- SEO geográfico -->
  <meta name="geo.region" content="CO">
  <meta name="geo.placename" content="Colombia">
  <meta name="distribution" content="global">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS principal -->
  <link rel="stylesheet" href="/splendorherbs/css/styles.css">

  <!-- Favicon -->
  <link rel="icon" href="/splendorherbs/img/favicon.png" type="image/png">
</head>

<body>

  <!-- Header dinámico -->
  <div id="header"></div>

  <main class="main-content">

    <!-- HERO -->
    <section class="galeria-simple-header">
      <h2 data-es="HIERBAS AROMÁTICAS" data-en="AROMATIC HERBS">
        HIERBAS AROMÁTICAS
      </h2>

      <div class="separator-leaf">
        <span class="line"></span>
        <i class="fas fa-leaf"></i>
        <span class="line"></span>
      </div>
    </section>

    <!-- Catálogo -->
    <section class="catalogo">
      <div class="catalogo__intro">
        <h2 data-es="Selecciona una hierba para ver su ficha técnica"
            data-en="Select an herb to see its technical sheet">
          Selecciona una hierba para ver su ficha técnica
        </h2>
      </div>

      <div class="tiles" id="tiles">
        <!-- Tiles generados por JS -->
      </div>
    </section>
  </main>

  <!-- MODAL / RESULTS -->
  <section class="results" id="results">
     <!-- Contenido generado por JS -->
  </section>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- Scripts de Carga -->
  <script>
    let currentLang = localStorage.getItem('language') || 'es';

    async function loadHTML(id, file, callback) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
        document.getElementById(id).innerHTML = await res.text();
        if (callback) callback();
      } catch (err) {
        console.error(err);
      }
    }

    loadHTML('header', '/splendorherbs/html/header.html', () => {
      const script = document.createElement('script');
      script.src = '/splendorherbs/js/menus.js';
      document.body.appendChild(script);

      if (window.checkLanguage) window.checkLanguage();
    });

    loadHTML('footer', '/splendorherbs/html/footer.html');
  </script>

  <!-- LÓGICA DE HIERBAS -->

        },
        en: {
          nombre: "Mint",
          descripcion: "Refreshing, aromatic, and vibrant. Mint is perfect for juices, desserts, fresh waters, and cocktails. Known for its soothing properties and natural freshness.",
          variedad: "Common / Peppermint"
        }
      },
      {
        id: "romero",

        },

        }

      {

        en: {

          variedad: "Mediterranean"
        }
      },
      {
        id: "albahaca",

        es: {
          nombre: "Albahaca",
          descripcion: "Dulce y fragante. Imprescindible para pastas, pesto, pizzas, ensaladas y bebidas.",
          variedad: "Genovesa"
        },
        en: {
          nombre: "Basil",
          descripcion: "Sweet and fragrant. Essential for pastas, pesto, pizzas, salads, and drinks.",
          variedad: "Genovese"
        }
      },
      {
        id: "mejorana",
        imagen: "/splendorherbs/img/Mejorana.jpg",
        es: {
          nombre: "Mejorana",
          descripcion: "Dulce, suave y con notas florales. Perfecta para guisos, vegetales, salsas y carnes blancas. Aporta un toque delicado que conquista paladares.",
          variedad: "Común"
        },
        en: {

      {
        id: "estragon",

      {

          descripcion: "Hojas que perfuman todo. Perfectas para sopas, arroces, fríjoles, carnes y guisos. El laurel libera aroma lentamente y transforma tus recetas en platillos llenos de sabor profundo.",
          variedad: "Mediterráneo"
        },
        en: {

      },
      {
        id: "eneldo",
        imagen: "/splendorherbs/img/Eneldo.jpg",
        es: {

        },
        en: {

        }
      },
      {
        id: "tomillo",
        imagen: "/splendorherbs/img/Tomillo.png",
        es: {
          nombre: "Tomillo",
          descripcion: "Aromático, versátil y robusto. Recomendado para carnes, pollo, vegetales, panes y marinadas. Un toque de tomillo convierte recetas simples en platos llenos de personalidad.",
          variedad: "Común"
        },
        en: {
          nombre: "Thyme",
          descripcion: "Aromatic, versatile, and robust. Perfect for meats, chicken, vegetables, breads, and marinades. A touch of thyme turns simple dishes into flavorful creations.",
          variedad: "Common"
        }
      },
      {
        id: "hierbabuena",
        imagen: "/splendorherbs/img/Hierbabuena.png",
        es: {
          nombre: "Hierbabuena",
          descripcion: "Refrescante, aromática y deliciosa. Perfecta para limonadas, cocteles, infusiones y postres. También realza sopas y platos tradicionales.",
          variedad: "Criolla"
        },
        en: {
          nombre: "Spearmint",
          descripcion: "Refreshing, aromatic, and delicious. Perfect for lemonades, cocktails, infusions, and desserts. Also enhances traditional savory dishes.",
          variedad: "Spearmint"
        }
      }
    ];

    const tilesContainer = document.getElementById('tiles');
    const resultsContainer = document.getElementById('results');
    currentLang = localStorage.getItem('language') || 'es';

    function updateStaticText() {
      document.querySelectorAll('[data-es]').forEach(el => {
        const text = el.getAttribute(`data-${currentLang}`);
        if(text) el.innerText = text;
      });
    }

    function renderTiles() {
      tilesContainer.innerHTML = '';
      HIERBAS.forEach(p => {
        const dataLang = p[currentLang];
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.id = p.id;
        
        const errorFallback = `this.onerror=null;this.src='/splendorherbs/img/logo.png'`;

        tile.innerHTML = `
            <img src="${p.imagen}" onerror="${errorFallback}" alt="${dataLang.nombre}">
            <div class="tile__label">${dataLang.nombre}</div>
        `;
        tilesContainer.appendChild(tile);
      });
    }

    function openModal(producto) {
      const d = producto[currentLang];
      const lblVariety = currentLang === 'es' ? 'Variedad' : 'Variety';
      const errorFallback = `this.onerror=null;this.src='/splendorherbs/img/logo.png'`;

      resultsContainer.innerHTML = `
        <article class="card">
          <button class="card__close" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <img class="card__img" src="${producto.imagen}" onerror="${errorFallback}" alt="${d.nombre}">
          <div class="card__body">
            <h3 class="card__title"><span class="badge"></span> ${d.nombre}</h3>
            <p class="meta">${d.descripcion}</p>
            ${d.variedad ? `<p class="meta"><b>${lblVariety}:</b> ${d.variedad}</p>` : ''}
          </div>
        </article>
      `;

      resultsContainer.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      resultsContainer.classList.remove('active');
      document.body.style.overflow = '';
      setTimeout(() => resultsContainer.innerHTML = '', 300);
    }

    // Eventos
    tilesContainer.addEventListener('click', e => {
      const tile = e.target.closest('.tile');
      if (!tile) return;
      const p = HIERBAS.find(h => h.id === tile.dataset.id);
      if(p) openModal(p);
    });

    resultsContainer.addEventListener('click', e => {
      if (e.target.classList.contains('card__close') || e.target.closest('.card__close') || e.target === resultsContainer) {
        closeModal();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === "Escape" && resultsContainer.classList.contains('active')) closeModal();
    });

    document.addEventListener('languageChanged', e => {
      if (e.detail?.language) {
        currentLang = e.detail.language;
        updateStaticText();
        renderTiles();
        closeModal();
      }
    });

    // Iniciar
    updateStaticText();
    renderTiles();
  </script>

</body>
</html>
