<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8WSGJQ6WYK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-8WSGJQ6WYK');

    /* 
       IMPORTANTE: AQUÍ IRÁ TU EVENTO DE CONVERSIÓN DE GOOGLE ADS 
       Ejemplo (descomentar cuando tengas el ID):
       // gtag('event', 'conversion', {'send_to': 'AW-XXXXXXXX/Label'});
    */

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO: Título simple y claro -->
  <title>¡Mensaje Enviado! | Splendor Herbs</title>

  <!-- META ROBOTS: NOINDEX (Vital para páginas de gracias) -->
  <meta name="robots" content="noindex, follow">

  <!-- CANONICAL -->
  <link rel="canonical" href="https://splendorherbs.com/gracias/" />

  <!-- FAVICONS (Rutas absolutas) -->
  <link rel="shortcut icon" href="/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/icon-192.png">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- CSS Global -->
  <link rel="stylesheet" href="/css/styles.css">
  
  <style>
    :root {
      --primary-green: #13854b;
      --bg-light: #f6faf7;
      --shadow: 0 15px 40px rgba(19, 133, 75, 0.2);
    }

    /* 1. Bloqueo total del scroll */
    body {
      margin: 0;
      overflow: hidden; 
      font-family: 'Montserrat', sans-serif;
    }

    /* 2. Capa que cubre todo */
    .fullscreen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-light);
      background-image: radial-gradient(#e1f5e8 1px, transparent 1px);
      background-size: 25px 25px;
      z-index: 99999; 
      
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Caja del mensaje */
    .thankyou-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: var(--shadow);
      border-top: 6px solid var(--primary-green);
      
      /* Animación Pop-In */
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      opacity: 0;
      transform: scale(0.8);
    }

    .thankyou-box img {
      width: 110px;
      margin-bottom: 20px;
      height: auto; /* Prevent layout shift */
    }

    .thankyou-box h1 {
      color: var(--primary-green); font-size: 2.5rem;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 25px; font-weight: 100;
    }
    

    .thankyou-box p {
      color: #555;
      margin-bottom: 30px;
      line-height: 1.5;
      font-size: 1.1rem;
    }

    .btn {
      background: var(--primary-green);
      color: #fff;
      padding: 14px 35px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      background: #0e6338;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    @keyframes popIn {
      to { opacity: 1; transform: scale(1); }
    }

    /* Responsive Móvil */
    @media (max-width: 480px) {
      .thankyou-box { padding: 30px 20px; }
      .thankyou-box h1 { font-size: 1.8rem; }
      .btn { width: 100%; display: block; box-sizing: border-box; }
    }
  </style>
</head>
<body>

<!-- Header (Oculto visualmente por el overlay, pero cargado por consistencia de scripts) -->
<div id="header"></div>

<!-- Overlay de pantalla completa -->
<div class="fullscreen-overlay">
  <div class="thankyou-box">
    <!-- CORRECCIÓN: Ruta absoluta y nombre de archivo sin espacios (recomendado) -->
    <!-- Asegúrate de renombrar tu imagen a logo-splendor.png o ajustar esta ruta -->
    <img src="/img/Logo Splendor Herbs.png" alt="Splendor Herbs Logo">
    
    <!-- TÍTULO -->
    <h1 
      data-es="¡Gracias por contactarnos!" 
      data-en="Thank you for contacting us!">
      ¡Gracias por contactarnos!
    </h1>
    
    <!-- PÁRRAFO -->
    <p 
      data-es="Hemos recibido tu mensaje correctamente. Nuestro equipo te responderá lo antes posible." 
      data-en="We have successfully received your message. Our team will respond as soon as possible.">
      Hemos recibido tu mensaje correctamente.<br>
      Nuestro equipo te responderá lo antes posible.
    </p>

    <!-- BOTÓN: Redirige al HOME (/) para mantener URLs limpias -->
    <a href="/" class="btn"
       data-es="Volver al inicio"
       data-en="Back to home">
       Volver al inicio
    </a>
  </div>
</div>

<div id="footer"></div>

<script>
  // Carga de componentes
  async function loadHTML(id, file, callback) {
    try {
      const res = await fetch(file);
      if(res.ok) {
        document.getElementById(id).innerHTML = await res.text();
        if (callback) callback();
      }
    } catch (e) { console.error(e); }
  }

  // Header
  loadHTML('header', '/html/header.html', () => {
    const script = document.createElement('script');
    script.src = '/js/menus.js';
    document.body.appendChild(script);
  });

  // Footer
  loadHTML('footer', '/html/footer.html');

  // TRADUCCIÓN INMEDIATA (Anti-Parpadeo)
  (function() {
      const lang = localStorage.getItem('language') || 'es';
      document.querySelectorAll('[data-es][data-en]').forEach(el => {
          el.innerText = el.getAttribute('data-' + lang);
      });
  })();
</script>

</body>
</html>
