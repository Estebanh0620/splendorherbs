<body>

  <!-- Header (Se carga vía JS) -->
  <div id="header"></div>

  <main class="main-content">

    <section class="contacto">
      <!-- H1 ÚNICO Y OPTIMIZADO -->
      <h1 class="section-title-contact" data-es="CONTÁCTANOS" data-en="CONTACT US">
        CONTÁCTANOS
      </h1>

      <div class="separator-leaf">
        <span class="line"></span>
        <i class="fas fa-leaf"></i>
        <span class="line"></span>
      </div>

      <!-- FORMULARIO -->
      <!-- Nota: formsubmit.co funciona bien para sitios estáticos -->
      <form class="form-grid" id="contactForm" method="POST" action="https://formsubmit.co/splendorherbssas@gmail.com">

        <!-- URL limpia para página de agradecimiento -->
        <input type="hidden" name="_next" value="https://splendorherbs.com/gracias/">
        
        <!-- Configuración del servicio de correo -->
        <input type="hidden" name="_subject" value="Nuevo Lead Web (Splendor Herbs)">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">

        <!-- CAMPOS DEL FORMULARIO -->
        <div class="field">
          <label for="email" data-es="Correo electrónico" data-en="Email Address">Correo electrónico</label>
          <input id="email" name="email" type="email" required
            placeholder="tucorreo@empresa.com"
            data-ph-es="tucorreo@empresa.com"
            data-ph-en="youremail@company.com">
        </div>

        <div class="field">
          <label for="nombres" data-es="Nombre completo" data-en="Full Name">Nombre completo</label>
          <input id="nombres" name="nombres" type="text" required
            placeholder="Ej: Juan Pérez"
            data-ph-es="Ej: Juan Pérez"
            data-ph-en="Ex: John Doe">
        </div>

        <div class="field">
          <label for="celular" data-es="Celular / WhatsApp" data-en="Phone / WhatsApp">Celular</label>
          <input id="celular" name="celular" type="tel">
        </div>

        <div class="field">
          <label for="ciudad" data-es="Ciudad" data-en="City">Ciudad</label>
          <input id="ciudad" name="ciudad" type="text">
        </div>

        <div class="field">
          <label for="direccion" data-es="Dirección" data-en="Address">Dirección</label>
          <input id="direccion" name="direccion" type="text">
        </div>

        <div class="field">
          <label for="pais" data-es="País" data-en="Country">País</label>
          <input id="pais" name="pais" type="text">
        </div>

        <div class="field span-2">
          <label for="observaciones" data-es="¿Qué productos necesitas cotizar?" data-en="What products do you need to quote?">
            Observaciones adicionales
          </label>
          <textarea id="observaciones" name="observaciones"
            placeholder="Describe aquí tu requerimiento..."
            data-ph-es="Describe aquí tu requerimiento..."
            data-ph-en="Describe here your request..."></textarea>
        </div>

        <div class="actions span-2">
          <button class="btn" type="submit" data-es="ENVIAR MENSAJE" data-en="SEND MESSAGE">
            ENVIAR MENSAJE
          </button>
        </div>

      </form>
    </section>
  </main>

  <!-- Footer (Se carga vía JS) -->
  <div id="footer"></div>

  <!-- SCRIPT DE FUNCIONALIDAD -->
  <script>
    let currentLang = localStorage.getItem('language') || 'es';

    // Función asíncrona para cargar componentes HTML
    async function loadHTML(id, file, callback) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`Error cargando ${file}`);
        const text = await res.text();
        document.getElementById(id).innerHTML = text;
        if (callback) callback();
      } catch (err) {
        console.error('Error loading component:', err);
      }
    }

    // Cargar Header (Ruta absoluta)
    loadHTML('header', '/html/header.html', () => {
      // Cargar script del menú después de insertar el HTML
      const script = document.createElement('script');
      script.src = '/js/menus.js'; // Ruta absoluta
      document.body.appendChild(script);
      
      // Aplicar idioma al header recién cargado
      setLanguage(currentLang);
    });

    // Cargar Footer (Ruta absoluta)
    loadHTML('footer', '/html/footer.html', () => {
      // Aplicar idioma al footer recién cargado
      setLanguage(currentLang);
    });
    
    // Sistema de Traducción
    function setLanguage(lang) {
      currentLang = lang;
      
      // Texto normal
      document.querySelectorAll('[data-es]').forEach(el => {
        el.innerText = el.getAttribute(`data-${lang}`);
      });
      
      // Placeholders de inputs
      document.querySelectorAll('[data-ph-es]').forEach(el => {
        if(el.getAttribute(`data-ph-${lang}`)) {
          el.placeholder = el.getAttribute(`data-ph-${lang}`);
        }
      });
    }

    // Inicializar idioma
    setLanguage(currentLang);

    // Escuchar evento personalizado (emitido desde menus.js al cambiar bandera)
    document.addEventListener('languageChanged', e => {
      setLanguage(e.detail.language);
    });

    // UX: Feedback visual al enviar formulario
    const form = document.getElementById('contactForm');
    if(form) {
      form.addEventListener('submit', () => {
        const btn = form.querySelector('.btn');
        btn.disabled = true; 
        btn.innerHTML = currentLang === 'es'
          ? 'ENVIANDO... <i class="fas fa-spinner fa-spin"></i>'
          : 'SENDING... <i class="fas fa-spinner fa-spin"></i>';
        btn.style.opacity = '0.7';
        btn.style.cursor = 'not-allowed';
      });
    }
  </script>
