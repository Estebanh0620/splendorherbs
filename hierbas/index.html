<body>

  <main class="main-content">

    <!-- HERO -->

    <!-- Catálogo -->
    <section class="catalogo">
      <div class="catalogo__intro">
        <h2 data-es="Nuestra selección de exportación"
            data-en="Our export selection" style="font-size: 1.5rem;">
          Nuestra selección de exportación
        </h2>
        <!-- Pequeño texto oculto visualmente o discreto ayuda al SEO si el JS falla, 
             pero con el Schema JSON-LD de arriba ya estamos cubiertos -->
        <p style="text-align: center; max-width: 800px; margin: 0 auto 2rem;">
            <span data-es="Cultivamos y seleccionamos las mejores hierbas para el mercado internacional." 
                  data-en="We grow and select the best herbs for the international market.">
                  Cultivamos y seleccionamos las mejores hierbas para el mercado internacional.

        </p>
      </div>

      <div class="tiles" id="tiles">
        <!-- Tiles generados por JS -->

        </noscript>

  </main>

  <!-- MODAL / RESULTS -->
  <section class="results" id="results">
     <!-- Contenido generado por JS -->
  </section>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- Scripts de Carga -->
  <script>
    let currentLang = localStorage.getItem('language') || 'es';

    async function loadHTML(id, file, callback) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
        document.getElementById(id).innerHTML = await res.text();
        if (callback) callback();
      } catch (err) {
        console.error(err);
      }
    }

    loadHTML('header', '/html/header.html', () => {
      const script = document.createElement('script');
      script.src = '/js/menus.js';
      document.body.appendChild(script);
    });

    loadHTML('footer', '/html/footer.html');
  </script>

  <!-- LÓGICA DE HIERBAS -->
  <script>
    // NOTA: He normalizado las rutas de las imágenes para que empiecen con "/"
    // Esto evita errores si mueves el archivo a otra carpeta.
    const HIERBAS = [
      {
        id: "menta",
        imagenPortada: "/img/mentacultivo.jpeg", 
        imagen: "/img/menta.jpeg",
        es: {
          nombre: "Menta",
          descripcion: "Refrescante, aromática y vibrante. La menta es el toque perfecto para tus jugos, postres y cocteles.",
        },
        en: {
          nombre: "Mint",
          descripcion: "Refreshing, aromatic, and vibrant. Mint is perfect for juices, desserts, and cocktails.",
        }
      },
      {
        id: "romero",
        imagenPortada: "/img/romerocultivo.jpeg",
        imagen: "/img/romerocultivo.jpeg",
        es: {
          nombre: "Romero",
          descripcion: "Potente, aromático y lleno de sabor. El romero realza carnes, papas y asados.",
        },
        en: {
          nombre: "Rosemary",
          descripcion: "Bold, aromatic, and full of character. Rosemary enhances meats, potatoes, and roasted dishes.",
        }
      },
      {
        id: "oregano",
        imagenPortada: "/img/oregano.png",
        imagen: "/img/oregano.png",
        es: {
          nombre: "Orégano",
          descripcion: "Tu aliado perfecto en pastas, pizzas, sopas y adobos.",
          variedad: "Amejoranado"
        },
        en: {
          nombre: "Oregano",
          descripcion: "The perfect companion for pastas, pizzas, soups, and marinades.",
          variedad: "Amejoranado"
        }
      },
      {
        id: "albahaca",
        imagenPortada: "/img/albaca.jpeg",
        imagen: "/img/albaca.jpeg",
        es: {
          nombre: "Albahaca",
          descripcion: "Dulce y fragante. Imprescindible para pastas, pesto y pizzas.",
          variedad: "NUFAR"
        },
        en: {
          nombre: "Basil",
          descripcion: "Sweet and fragrant. Essential for pastas, pesto, and pizzas.",
          variedad: "NUFAR"
        }
      },
      {
        id: "mejorana",
        imagenPortada: "/img/Mejorana.jpg",
        imagen: "/img/Mejorana.jpg",
        es: {
          nombre: "Mejorana",
          descripcion: "Dulce, suave y con notas florales. Perfecta para guisos y salsas.",
        },
        en: {
          nombre: "Marjoram",
          descripcion: "Mild, sweet, and delicately floral. Ideal for stews and sauces.",
        }
      },
      {
        id: "estragon",
        imagenPortada: "/img/estragoncultivo.jpeg",
        imagen: "/img/estragon.jpeg",
        es: {
          nombre: "Estragón",
          descripcion: "Elegante y aromático. Aporta un sabor único a salsas cremosas y pescados.",
          variedad: "Francés"
        },
        en: {
          nombre: "Tarragon",
          descripcion: "Elegant and aromatic. Brings a unique flavor to creamy sauces and fish.",
          variedad: "French"
        }
      },
      {
        id: "laurel",
        imagenPortada: "/img/galeria/cultivos5.webp",
        imagen: "/img/galeria/cultivos6.webp",
        es: {
          nombre: "Laurel",
          descripcion: "Hojas que perfuman todo. Perfectas para sopas, arroces y guisos.",
        },
        en: {
          nombre: "Bay Leaf",
          descripcion: "Leaves that slowly release deep aroma. Perfect for soups and stews.",
        }
      },
      {
        id: "eneldo",
        imagenPortada: "/img/Eneldo.jpg",
        imagen: "/img/Eneldo.jpg",
        es: {
          nombre: "Eneldo",
          descripcion: "Fresco y cítrico. Ideal para pescados, ensaladas y encurtidos.",
        },
        en: {
          nombre: "Dill",
          descripcion: "Fresh and lightly citrusy. Ideal for fish, salads, and pickles.",
        }
      },
      {
        id: "tomillo",
        imagenPortada: "/img/tomillo.jpeg",
        imagen: "/img/tomillo.jpeg",
        es: {
          nombre: "Tomillo",
          descripcion: "Aromático y robusto. Recomendado para carnes y marinadas.",
        },
        en: {
          nombre: "Thyme",
          descripcion: "Aromatic and robust. Perfect for meats and marinades.",
        }
      }
    ];

    const tilesContainer = document.getElementById('tiles');
    const resultsContainer = document.getElementById('results');
    // Reiniciar currentLang para asegurar lectura fresca
    currentLang = localStorage.getItem('language') || 'es';

    function updateStaticText() {
      document.querySelectorAll('[data-es]').forEach(el => {
        const text = el.getAttribute(`data-${currentLang}`);
        if(text) el.innerText = text;
      });
    }

    function renderTiles() {
      tilesContainer.innerHTML = '';
      HIERBAS.forEach(p => {
        const dataLang = p[currentLang];
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.id = p.id;
        
        // Uso rutas absolutas ahora, el fallback usa una ruta segura genérica
        const coverImg = p.imagenPortada || p.imagen;
        const errorFallback = `this.onerror=null;this.src='/img/logo2.png'`; 

        tile.innerHTML = `
            <img src="${coverImg}" onerror="${errorFallback}" alt="${dataLang.nombre} - Splendor Herbs" loading="lazy">
            <div class="tile__label"><h3>${dataLang.nombre}</h3></div>
        `;
        tilesContainer.appendChild(tile);
      });
    }

    function openModal(producto) {
      const d = producto[currentLang];
      const lblVariety = currentLang === 'es' ? 'Variedad' : 'Variety';
      const errorFallback = `this.onerror=null;this.src='/img/logo2.png'`;

      resultsContainer.innerHTML = `
        <article class="card">
          <button class="card__close" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <img class="card__img" src="${producto.imagen}" onerror="${errorFallback}" alt="${d.nombre}">
          <div class="card__body">
            <h3 class="card__title">${d.nombre}</h3>
            <p class="meta">${d.descripcion}</p>
            ${d.variedad ? `<p class="meta"><b>${lblVariety}:</b> ${d.variedad}</p>` : ''}
          </div>
        </article>
      `;

      resultsContainer.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      resultsContainer.classList.remove('active');
      document.body.style.overflow = '';
      setTimeout(() => resultsContainer.innerHTML = '', 300);
    }

    // Eventos
    tilesContainer.addEventListener('click', e => {
      const tile = e.target.closest('.tile');
      if (!tile) return;
      const p = HIERBAS.find(h => h.id === tile.dataset.id);
      if(p) openModal(p);
    });

    resultsContainer.addEventListener('click', e => {
      if (e.target.classList.contains('card__close') || e.target.closest('.card__close') || e.target === resultsContainer) {
        closeModal();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === "Escape" && resultsContainer.classList.contains('active')) closeModal();
    });

    document.addEventListener('languageChanged', e => {
      if (e.detail?.language) {
        currentLang = e.detail.language;
        updateStaticText();
        renderTiles();
        closeModal();
      }
    });

    // Iniciar
    updateStaticText();
    renderTiles();
  </script>

</body>
</html>
