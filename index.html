<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Splendor Herbs | Aromáticas y Hortalizas Frescas desde Colombia</title>
  <meta name="description" content="Splendor Herbs SAS ofrece hierbas aromáticas y hortalizas frescas...">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="language" content="es">
  <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- CSS GLOBAL -->
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

  <!-- Header dinámico -->
  <div id="header"></div>

  <main class="main-content">

    <!-- HERO -->
    <!-- Corrección: img/1.png (sin ../) -->
    <section class="hero" style="background-image: url('img/1.png');" aria-label="Presentación Splendor Herbs">
      <div class="hero-overlay">
        <div class="hero-inner-content">

          <!-- Logo -->
          <div class="hero-col-logo">
            <!-- Corrección: img/logo2.png -->
            <img src="img/logo2.png" alt="Splendor Herbs - Logo oficial">
          </div>

          <!-- Texto Hero -->
          <div class="hero-col-text">
            <h1>
              AROMÁTICAS FRESCAS CON<br>
              CALIDAD Y SOSTENIBILIDAD<br>
              DESDE COLOMBIA
            </h1>
          </div>

        </div>
      </div>
    </section>

    <!-- CONTENIDO -->
    <div class="content-container">

      <h2 class="section-title">QUIÉNES SOMOS</h2>

      <div class="separator-leaf" aria-hidden="true">
        <span class="line"></span>
        <i class="fas fa-leaf"></i>
        <span class="line"></span>
      </div>

      <div class="split-section">

        <!-- Video -->
        <div class="split-video">
          <video autoplay loop muted playsinline preload="metadata">
            <!-- Corrección: img/videoindex.mp4 -->
            <source src="img/videoindex.mp4" type="video/mp4">
            Tu navegador no soporta la reproducción de videos.
          </video>
        </div>

        <!-- Texto -->
        <div class="split-text">
          <p>
            Desde 2017 nació en Madrid, Cundinamarca, Splendor Herbs SAS...
          </p>
        </div>

      </div>

      <div class="full-width-text">
        <p>
          Nuestro camino ha estado marcado por el compromiso con la sostenibilidad...
        </p>
      </div>

      <h2 class="section-title">CERTIFICACIONES</h2>

      <div class="separator-leaf" aria-hidden="true">
        <span class="line"></span>
        <i class="fas fa-leaf"></i>
        <span class="line"></span>
      </div>

      <div class="certificados">
        <!-- Corrección: img/primus.png -->
        <img src="img/primus.png" alt="Certificación Primus GFS">
        <img src="img/ICA.webp" alt="Certificación ICA Colombia">
      </div>

    </div>
  </main>

  <!-- Footer dinámico -->
  <div id="footer"></div>

  <!-- JS -->
  <script>
    async function loadHTML(id, file, callback) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
        const text = await res.text();
        document.getElementById(id).innerHTML = text;
        
        // Pequeño timeout para asegurar que el DOM se pintó antes de ejecutar el JS
        if (callback) setTimeout(callback, 0); 
      } catch (err) {
        console.error(err);
      }
    }

   // Header
    loadHTML('header', '/html/header.html', () => {
      const script = document.createElement('script');
      script.src = '/js/menus.js'; // Nota la barra al inicio "/"
      document.body.appendChild(script);
    });

    // Footer
    loadHTML('footer', '/html/footer.html');
</script>
</body>
</html>
